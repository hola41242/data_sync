name: Data Sync Runner

on:
  workflow_dispatch:
    inputs:
      target_box:
        description: 'Choose config box to restore'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'transmission'
          - 'transmission_box2'
          - 'transmission_box3'
          - 'transmission_box4'

jobs:
  telemetry_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - name: Prepare Clean Environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq transmission-daemon transmission-cli rclone curl
          sudo systemctl stop transmission-daemon 2>/dev/null || true
          sudo pkill -9 -f transmission 2>/dev/null || true

      - name: Send Telegram - Start Notification
        env:
          TARGET: ${{ inputs.target_box }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="🚀 [Runner Started] Box: ${TARGET}. Fetching verified state from Google Drive..." > /dev/null || true
          fi

      - name: Mount Cloud State Cache
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          TARGET: ${{ inputs.target_box }}
        run: |
          mkdir -p ~/.config/rclone
          mkdir -p /home/runner/.config/sync_worker/torrents
          mkdir -p /home/runner/.config/sync_worker/resume
          mkdir -p /home/runner/storage_root

          # Setup rclone config securely
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

          # Determine active Google Drive remote (checks gdrive first, then maindrive)
          REMOTE="gdrive"
          if ! rclone lsd "${REMOTE}:" > /dev/null 2>&1; then
            echo "Remote 'gdrive' failed or expired, testing 'maindrive'..."
            REMOTE="maindrive"
          fi
          echo "Selected active Google Drive remote: ${REMOTE}"

          # Pull verified state metadata from Drive
          if [ "$TARGET" = "all" ]; then
            echo "Pulling state files from all boxes..."
            rclone copy "${REMOTE}:qbit_config" /home/runner/.config/sync_worker/temp_fetch/ --include "*/resume/**" --include "*/torrents/**" -v || true
            find /home/runner/.config/sync_worker/temp_fetch/ -type f -path "*/resume/*" -exec mv -t /home/runner/.config/sync_worker/resume/ {} + 2>/dev/null || true
            find /home/runner/.config/sync_worker/temp_fetch/ -type f -path "*/torrents/*" -exec mv -t /home/runner/.config/sync_worker/torrents/ {} + 2>/dev/null || true
            rm -rf /home/runner/.config/sync_worker/temp_fetch
          else
            echo "Pulling state files from ${TARGET}..."
            rclone copy "${REMOTE}:qbit_config/$TARGET/resume" /home/runner/.config/sync_worker/resume/ -v || true
            rclone copy "${REMOTE}:qbit_config/$TARGET/torrents" /home/runner/.config/sync_worker/torrents/ -v || true
          fi

          echo "Files restored:"
          ls -la /home/runner/.config/sync_worker/resume/ || true
          ls -la /home/runner/.config/sync_worker/torrents/ || true

          # Create ultra-safe configuration (Zero bandwidth, Zero peers, Announce only)
          cat << 'EOF' > /home/runner/.config/sync_worker/settings.json
          {
            "download-dir": "/home/runner/storage_root",
            "incomplete-dir-enabled": false,
            "rpc-enabled": true,
            "rpc-port": 9091,
            "rpc-bind-address": "127.0.0.1",
            "rpc-authentication-required": false,
            "rpc-whitelist-enabled": false,
            "peer-limit-global": 0,
            "peer-limit-per-torrent": 0,
            "port-forwarding-enabled": false,
            "dht-enabled": false,
            "pex-enabled": false,
            "lpd-enabled": false,
            "speed-limit-up": 1,
            "speed-limit-up-enabled": true,
            "speed-limit-down": 1,
            "speed-limit-down-enabled": true
          }
          EOF

      - name: Initialize Telemetry Daemon
        run: |
          transmission-daemon -g /home/runner/.config/sync_worker -e /home/runner/sync.log
          sleep 4

          STATUS_OUTPUT=$(transmission-remote -l || echo "Failed to fetch status")
          echo "$STATUS_OUTPUT"

          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="✅ [Seeding Restored]%0A%0A<pre>${STATUS_OUTPUT}</pre>" \
              -d parse_mode="HTML" > /dev/null || true
          fi

      - name: Maintain Silent Announce Loop
        run: |
          echo "Announce service engaged. Keeping active for 4.5 hours..."
          # 27 cycles x 600 seconds = ~4.5 hours execution (clean shutdown before 5h ceiling)
          for cycle in {1..27}; do
            echo "--- Ping cycle $cycle / 27 ---"
            transmission-remote -t all --reannounce || true
            transmission-remote -l || true

            # Har 3 cycle (~30 mins) par Telegram status heartbeat
            if [ $((cycle % 3)) -eq 0 ] && [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
              SUMMARY=$(transmission-remote -l | head -n 8)
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT_ID}" \
                -d text="📡 [Pulse Check - Cycle ${cycle}/27]%0A<pre>${SUMMARY}</pre>" \
                -d parse_mode="HTML" > /dev/null || true
            fi

            sleep 600
          done

          echo "Graceful shutdown..."
          pkill -15 -f transmission 2>/dev/null || true
          sleep 3

          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT_ID}" \
              -d text="🛑 [Runner Complete] 4.5h completed safely." > /dev/null || true
          fi
