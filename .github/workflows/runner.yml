name: Data Sync Runner

on:
  workflow_dispatch:
    inputs:
      target_box:
        description: 'Choose config box to restore'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'transmission'
          - 'transmission_box2'
          - 'transmission_box3'
          - 'transmission_box4'

jobs:
  telemetry_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      TG_BOT_TOKEN: "8902164809:AAGtm0Hau0Whc_YhVL3khODTkcynOEjsgvg"
      TG_CHAT_ID: "6519226948"

    steps:
      - name: Prepare Clean Environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq transmission-daemon transmission-cli rclone curl
          sudo systemctl stop transmission-daemon 2>/dev/null || true
          sudo pkill -9 -f transmission 2>/dev/null || true

      - name: Send Telegram - Start Notification
        env:
          TARGET: ${{ inputs.target_box }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="🚀 [Runner Started] Target: ${TARGET}. Syncing state files from Google Drive..." > /dev/null || true

      - name: Mount Cloud State Cache
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          TARGET: ${{ inputs.target_box }}
        run: |
          mkdir -p ~/.config/rclone
          mkdir -p /home/runner/.config/sync_worker/torrents
          mkdir -p /home/runner/.config/sync_worker/resume
          mkdir -p /home/runner/storage_root

          # Setup rclone config securely from secret
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

          # Copy resume and torrent caches from Drive based on choice
          if [ "$TARGET" = "all" ]; then
            echo "Pulling metadata from all boxes..."
            rclone copy "gdrive:qbit_config" /home/runner/.config/sync_worker/ --include "*/resume/**" --include "*/torrents/**" -v
            find /home/runner/.config/sync_worker/ -type f -path "*/resume/*" -exec mv -t /home/runner/.config/sync_worker/resume/ {} + 2>/dev/null || true
            find /home/runner/.config/sync_worker/ -type f -path "*/torrents/*" -exec mv -t /home/runner/.config/sync_worker/torrents/ {} + 2>/dev/null || true
          else
            echo "Pulling metadata from $TARGET..."
            rclone copy "gdrive:qbit_config/$TARGET/resume" /home/runner/.config/sync_worker/resume/ -v
            rclone copy "gdrive:qbit_config/$TARGET/torrents" /home/runner/.config/sync_worker/torrents/ -v
          fi

          # Rewrite settings.json with absolute zero P2P connection policies
          cat << 'EOF' > /home/runner/.config/sync_worker/settings.json
          {
            "download-dir": "/home/runner/storage_root",
            "incomplete-dir-enabled": false,
            "rpc-enabled": true,
            "rpc-port": 9091,
            "rpc-bind-address": "127.0.0.1",
            "rpc-authentication-required": false,
            "rpc-whitelist-enabled": false,
            "peer-limit-global": 0,
            "peer-limit-per-torrent": 0,
            "port-forwarding-enabled": false,
            "dht-enabled": false,
            "pex-enabled": false,
            "lpd-enabled": false,
            "speed-limit-up": 1,
            "speed-limit-up-enabled": true,
            "speed-limit-down": 1,
            "speed-limit-down-enabled": true
          }
          EOF

      - name: Initialize Telemetry Daemon
        run: |
          transmission-daemon -g /home/runner/.config/sync_worker -e /home/runner/sync.log
          sleep 4
          
          STATUS_OUTPUT=$(transmission-remote -l || echo "Failed to fetch list")
          echo "$STATUS_OUTPUT"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="✅ [Seeding Restored] Daemon active.%0A%0A<pre>${STATUS_OUTPUT}</pre>" \
            -d parse_mode="HTML" > /dev/null || true

      - name: Maintain Silent Announce Loop
        run: |
          echo "Announce service engaged. Keeping active for 4.5 hours..."
          # 27 loops x 600s = 16200s (~4.5 hours safe execution window)
          for cycle in {1..27}; do
            echo "--- Ping cycle $cycle / 27 ---"
            transmission-remote --reannounce || true
            transmission-remote -l || true
            
            # Har 9 cycle (~1.5 ghante) baad ek Telegram ping
            if [ $((cycle % 9)) -eq 0 ]; then
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT_ID}" \
                -d text="⏳ [Heartbeat] Cycle ${cycle}/27 active. Tracker announced safely." > /dev/null || true
            fi

            sleep 600
          done

          echo "Graceful shutdown before runner termination..."
          pkill -15 -f transmission 2>/dev/null || true
          sleep 3

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="🛑 [Runner Complete] 4.5h finished safely. Ready for next loop." > /dev/null || true
