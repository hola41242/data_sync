name: Cloud Game Stream Server (Multi-Game WebDAV)

on:
  workflow_dispatch:
    inputs:
      archive_names:
        description: 'Comma-separated zip/rar names in gdrive:Games (e.g. CampusBonds-0.5-market.zip, Game2.zip)'
        required: true
        default: 'CampusBonds-0.5-market.zip'

jobs:
  stream-game:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Install Tools & Ngrok
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar
          curl https://rclone.org/install.sh | sudo bash
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install -y ngrok

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Pull & Prepare Games on GitHub Cloud SSD
        run: |
          mkdir -p /tmp/game_root
          IFS=',' read -ra ARCHIVES <<< "${{ github.event.inputs.archive_names }}"
          for RAW_NAME in "${ARCHIVES[@]}"; do
            ARCHIVE=$(echo "$RAW_NAME" | xargs)
            GAME_FOLDER="${ARCHIVE%.*}"
            mkdir -p raw_extract "/tmp/game_root/$GAME_FOLDER"

            rclone copyto "gdrive:Games/$ARCHIVE" "./$ARCHIVE" --multi-thread-streams 8 --drive-chunk-size 128M -P
            7z x "$ARCHIVE" -oraw_extract -y || unrar x -y "$ARCHIVE" raw_extract/
            rm -f "$ARCHIVE"

            SUBDIRS=$(find raw_extract -mindepth 1 -maxdepth 1 -type d | wc -l)
            FILES=$(find raw_extract -mindepth 1 -maxdepth 1 -type f | wc -l)
            if [ "$SUBDIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
              INNER_DIR=$(find raw_extract -mindepth 1 -maxdepth 1 -type d)
              mv "$INNER_DIR"/* "/tmp/game_root/$GAME_FOLDER/"
            else
              mv raw_extract/* "/tmp/game_root/$GAME_FOLDER/"
            fi
            rm -rf raw_extract/*

            # Extra Mac/Linux files hatao taaki Windows scan fast ho
            rm -rf "/tmp/game_root/$GAME_FOLDER"/*.app "/tmp/game_root/$GAME_FOLDER"/lib/py3-linux* "/tmp/game_root/$GAME_FOLDER"/lib/py3-mac* "/tmp/game_root/$GAME_FOLDER"/*.sh

            # Existing cloud saves restore karo
            mkdir -p "/tmp/game_root/$GAME_FOLDER/game/saves"
            rclone copy "gdrive:Games/$GAME_FOLDER/saves" "/tmp/game_root/$GAME_FOLDER/game/saves" --transfers 8 || true
          done
          chmod -R 777 /tmp/game_root

      - name: Start High-Speed Docker WebDAV & Static Ngrok
        run: |
          docker run -d --name game_webdav -p 8080:8080 -v /tmp/game_root:/data rclone/rclone:latest serve webdav /data --addr :8080 --dir-cache-time 24h --vfs-cache-mode minimal --buffer-size 128M
          ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"
          ngrok http 8080 --domain="${{ secrets.NGROK_DOMAIN }}" > /dev/null &
          sleep 5
          echo "LIVE STREAM READY AT: https://${{ secrets.NGROK_DOMAIN }}"

      - name: Keep Alive & Auto-Sync All Saves Every 5 Minutes
        run: |
          END_TIME=$(( $(date +%s) + 20700 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            for DIR in /tmp/game_root/*/; do
              GAME_FOLDER=$(basename "$DIR")
              rclone sync "/tmp/game_root/$GAME_FOLDER/game/saves" "gdrive:Games/$GAME_FOLDER/saves" --transfers 8 || true
            done
          done
