name: Universal RenPy Lossless Web Streamer (sync / sync_1..5)

on:
  workflow_dispatch:
    inputs:
      target_archive:
        description: 'LIST | STATUS [sync|sync_1..5] | [sync|sync_1..5] <games> | DELETE: slug'
        required: true
        default: 'STATUS'

permissions:
  contents: write

jobs:
  build-universal-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure Rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: List Games in Google Drive (LIST)
        if: ${{ github.event.inputs.target_archive == 'LIST' || github.event.inputs.target_archive == 'list' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export LIST_OUT=$(rclone lsf gdrive:Games --files-only | grep -iE '\.(zip|rar|7z)$' | sort)
          export COMMA_OUT=$(echo "$LIST_OUT" | paste -sd ", " -)
          echo "AVAILABLE ARCHIVES:"
          echo "$LIST_OUT"
          echo "COMMA-SEPARATED: $COMMA_OUT"

          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            python3 - << 'TGPY'
          import os, html, urllib.request, urllib.error, json

          def send_tg_safe(text, disable_preview=True):
              token = os.environ.get("TG_TOKEN", "").strip()
              chat_id = os.environ.get("TG_CHAT", "").strip()
              if not token or not chat_id:
                  return
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              for i in range(0, max(1, len(text)), 3500):
                  part = text[i:i+3500]
                  payload = {"chat_id": chat_id, "text": part, "disable_web_page_preview": disable_preview}
                  if part.count("<b>") == part.count("</b>") and part.count("<code>") == part.count("</code>") and part.count("<pre>") == part.count("</pre>"):
                      payload["parse_mode"] = "HTML"
                  req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
                  try:
                      urllib.request.urlopen(req, timeout=20)
                  except urllib.error.HTTPError as e:
                      print(f"Telegram HTTP error: {e.code} -> {e.read().decode('utf-8', errors='ignore')}")

          list_out = html.escape(os.environ.get("LIST_OUT", "").strip())
          comma_out = html.escape(os.environ.get("COMMA_OUT", "").strip())
          msg = "📂 <b>Google Drive (gdrive:Games):</b>\n\n" + (f"<pre>{list_out}</pre>\n\n📋 <b>Copy-Paste Build Command:</b>\n<code>/build sync {comma_out}</code>" if list_out else "<i>No archives found.</i>")
          send_tg_safe(msg, disable_preview=True)
          TGPY
          fi

      - name: Check Storage & Ready Builds (STATUS / STATUS sync..sync_5)
        if: ${{ startsWith(github.event.inputs.target_archive, 'STATUS') || startsWith(github.event.inputs.target_archive, 'status') }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          POD_TARGETS_JSON: ${{ secrets.POD_TARGETS_JSON }}
          TARGET: ${{ github.event.inputs.target_archive }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'STATPY'
          import os, re, html, urllib.request, urllib.error, json, shutil, subprocess

          def send_tg_safe(text, disable_preview=True):
              token = os.environ.get("TG_TOKEN", "").strip()
              chat_id = os.environ.get("TG_CHAT", "").strip()
              if not token or not chat_id:
                  return
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              for i in range(0, max(1, len(text)), 3500):
                  part = text[i:i+3500]
                  payload = {"chat_id": chat_id, "text": part, "disable_web_page_preview": disable_preview}
                  if part.count("<b>") == part.count("</b>") and part.count("<code>") == part.count("</code>") and part.count("<pre>") == part.count("</pre>"):
                      payload["parse_mode"] = "HTML"
                  req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
                  try:
                      urllib.request.urlopen(req, timeout=20)
                  except urllib.error.HTTPError as e:
                      print(f"Telegram HTTP error: {e.code} -> {e.read().decode('utf-8', errors='ignore')}")

          default_pods = [
              {"name": "sync", "repo": os.environ["REPO_NAME"], "pages_base": f"https://hola41242.github.io/{os.environ['REPO_NAME'].split('/')[-1]}", "max_mb": 850},
              {"name": "sync_1", "repo": "hola41242/data_sync_1", "pages_base": "https://hola41242.github.io/data_sync_1", "max_mb": 850},
              {"name": "sync_2", "repo": "hola41242/data_sync_2", "pages_base": "https://hola41242.github.io/data_sync_2", "max_mb": 850},
              {"name": "sync_3", "repo": "hola41242/data_sync_3", "pages_base": "https://hola41242.github.io/data_sync_3", "max_mb": 850},
              {"name": "sync_4", "repo": "hola41242/data_sync_4", "pages_base": "https://hola41242.github.io/data_sync_4", "max_mb": 850},
              {"name": "sync_5", "repo": "hola41242/data_sync_5", "pages_base": "https://hola41242.github.io/data_sync_5", "max_mb": 850},
          ]
          raw_pods = os.environ.get("POD_TARGETS_JSON", "").strip()
          pods = json.loads(raw_pods) if raw_pods else default_pods
          token = os.environ["GH_TOKEN"]

          m_filter = re.match(r'^[Ss][Tt][Aa][Tt][Uu][Ss](?:\s+(.+))?$', os.environ.get("TARGET", "").strip())
          flt = (m_filter.group(1) or "").strip().lower() if m_filter else ""

          key_to_idx = {
              "sync": 0, "pod-0": 0, "data_sync": 0,
              "sync_1": 1, "pod-1": 1, "data_sync_1": 1,
              "sync_2": 2, "pod-2": 2, "data_sync_2": 2,
              "sync_3": 3, "pod-3": 3, "data_sync_3": 3,
              "sync_4": 4, "pod-4": 4, "data_sync_4": 4,
              "sync_5": 5, "pod-5": 5, "data_sync_5": 5,
          }

          if flt in key_to_idx and key_to_idx[flt] < len(pods):
              i = key_to_idx[flt]
              selected_pods = [(i, pods[i])]
          else:
              selected_pods = list(enumerate(pods))

          def dir_size(path):
              total = 0
              for r, _, files in os.walk(path):
                  for f in files:
                      total += os.path.getsize(os.path.join(r, f))
              return total

          pod_lines = []
          game_lines = []
          total_used_mb = 0.0
          total_cap_mb = 0.0
          total_games = 0

          for idx, pod in selected_pods:
              pname = pod.get("name", f"sync_{idx}" if idx else "sync")
              prepo = pod["repo"]
              pbase = pod["pages_base"].rstrip("/")
              pmax = float(pod.get("max_mb", 850))
              total_cap_mb += pmax
              pdir = f"pod_status_{idx}"
              shutil.rmtree(pdir, ignore_errors=True)
              os.makedirs(pdir, exist_ok=True)
              remote_url = f"https://x-access-token:{token}@github.com/{prepo}.git"
              subprocess.run(["git", "init"], cwd=pdir, check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              subprocess.run(["git", "remote", "add", "origin", remote_url], cwd=pdir, check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              has_branch = subprocess.run(["git", "ls-remote", "--exit-code", "--heads", "origin", "gh-pages"], cwd=pdir, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
              if has_branch:
                  subprocess.run(["git", "fetch", "origin", "gh-pages"], cwd=pdir, check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  subprocess.run(["git", "checkout", "-b", "gh-pages", "origin/gh-pages"], cwd=pdir, check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

              p_bytes = 0
              if has_branch:
                  games = sorted([d for d in os.listdir(pdir) if os.path.isdir(os.path.join(pdir, d)) and not d.startswith('.') and os.path.exists(os.path.join(pdir, d, 'index.html'))])
                  for g in games:
                      sz = dir_size(os.path.join(pdir, g))
                      p_bytes += sz
                      total_games += 1
                      game_lines.append(f"• <code>{html.escape(g)}</code> [{html.escape(pname)}] ({round(sz/1048576, 1)} MB) → {pbase}/{g}/")

              used_mb = round(p_bytes / 1048576, 1)
              free_mb = round(max(0.0, pmax - used_mb), 1)
              total_used_mb += used_mb
              pages_note = "" if has_branch else " <i>(no gh-pages yet)</i>"
              pod_lines.append(f"• <b>{html.escape(pname)}</b> (<code>{html.escape(prepo)}</code>): <code>{used_mb} / {pmax} MB</code> (<code>{free_mb} MB</code> free){pages_note}")

          body = "\n".join(game_lines) if game_lines else "<i>No live games deployed yet.</i>"
          pods_summary = "\n".join(pod_lines)
          title = f"Target Status: <code>{html.escape(flt)}</code>" if len(selected_pods) == 1 else "All Targets Overview"
          msg = (
              f"📊 <b>{title}:</b> <code>{round(total_used_mb, 1)} MB / {round(total_cap_mb, 1)} MB</code>\n"
              f"{pods_summary}\n\n"
              f"🎮 <b>Ready Builds ({total_games}):</b>\n{body}"
          )
          print(msg)
          send_tg_safe(msg, disable_preview=True)
          STATPY

      - name: Delete Specific Games (DELETE)
        if: ${{ startsWith(github.event.inputs.target_archive, 'DELETE:') || startsWith(github.event.inputs.target_archive, 'delete:') }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          POD_TARGETS_JSON: ${{ secrets.POD_TARGETS_JSON }}
          TARGET: ${{ github.event.inputs.target_archive }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'DELPY'
          import os, re, shutil, subprocess, json

          default_pods = [
              {"name": "sync", "repo": os.environ["REPO_NAME"], "pages_base": f"https://hola41242.github.io/{os.environ['REPO_NAME'].split('/')[-1]}", "max_mb": 850},
              {"name": "sync_1", "repo": "hola41242/data_sync_1", "pages_base": "https://hola41242.github.io/data_sync_1", "max_mb": 850},
              {"name": "sync_2", "repo": "hola41242/data_sync_2", "pages_base": "https://hola41242.github.io/data_sync_2", "max_mb": 850},
              {"name": "sync_3", "repo": "hola41242/data_sync_3", "pages_base": "https://hola41242.github.io/data_sync_3", "max_mb": 850},
              {"name": "sync_4", "repo": "hola41242/data_sync_4", "pages_base": "https://hola41242.github.io/data_sync_4", "max_mb": 850},
              {"name": "sync_5", "repo": "hola41242/data_sync_5", "pages_base": "https://hola41242.github.io/data_sync_5", "max_mb": 850},
          ]
          raw_pods = os.environ.get("POD_TARGETS_JSON", "").strip()
          pods = json.loads(raw_pods) if raw_pods else default_pods
          token = os.environ["GH_TOKEN"]
          target_raw = os.environ["TARGET"]
          slugs = [s.strip().lower() for s in re.sub(r'^[Dd][Ee][Ll][Ee][Tt][Ee]:\s*', '', target_raw).split(',') if s.strip()]

          def rebuild_index(pdir):
              games = sorted([d for d in os.listdir(pdir) if os.path.isdir(os.path.join(pdir, d)) and not d.startswith('.') and os.path.exists(os.path.join(pdir, d, 'index.html'))])
              cards = "\n".join([f'<a href="./{g}/" style="display:block;padding:18px;margin:10px;background:#1e1e2e;color:#fff;text-decoration:none;border-radius:10px;font:600 18px sans-serif;border:1px solid #313244;">▶ {g.upper()} <span style="float:right;color:#a6e3a1;font-size:13px;">/{g}/</span></a>' for g in games])
              with open(os.path.join(pdir, "index.html"), "w", encoding="utf-8") as f:
                  f.write(f'<!DOCTYPE html><html><head><meta charset="utf-8"><title>Game Stream Library</title></head><body style="background:#11111b;color:#cdd6f4;font-family:sans-serif;max-width:700px;margin:40px auto;padding:20px;"><h1>🎮 Cloud Ren\'Py Library</h1>{cards}</body></html>')

          for idx, pod in enumerate(pods):
              prepo = pod["repo"]
              pdir = f"pod_del_{idx}"
              shutil.rmtree(pdir, ignore_errors=True)
              os.makedirs(pdir, exist_ok=True)
              remote_url = f"https://x-access-token:{token}@github.com/{prepo}.git"
              subprocess.run(["git", "init"], cwd=pdir, check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              subprocess.run(["git", "remote", "add", "origin", remote_url], cwd=pdir, check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if subprocess.run(["git", "ls-remote", "--exit-code", "--heads", "origin", "gh-pages"], cwd=pdir, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode != 0:
                  continue
              subprocess.run(["git", "fetch", "origin", "gh-pages"], cwd=pdir, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              subprocess.run(["git", "checkout", "-b", "gh-pages", "origin/gh-pages"], cwd=pdir, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

              changed = False
              for s in slugs:
                  gpath = os.path.join(pdir, s)
                  if os.path.isdir(gpath):
                      print(f"Deleting {s} from {prepo}")
                      shutil.rmtree(gpath, ignore_errors=True)
                      subprocess.run(["gh", "release", "delete", f"game-{s}", "--repo", prepo, "--yes", "--cleanup-tag"], env={**os.environ, "GH_TOKEN": token}, check=False)
                      changed = True

              if changed:
                  rebuild_index(pdir)
                  subprocess.run(["git", "config", "user.name", "github-actions[bot]"], cwd=pdir, check=True)
                  subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], cwd=pdir, check=True)
                  subprocess.run(["git", "add", "-A"], cwd=pdir, check=True)
                  subprocess.run(["git", "commit", "-m", "Delete selected games"], cwd=pdir, check=False)
                  subprocess.run(["git", "push", "origin", "gh-pages"], cwd=pdir, check=True)
          DELPY

          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"🗑️ Removed requested game(s)! Send /status to verify.\"}" >/dev/null
          fi

      - name: Setup Toolchain (Drive Cache -> ~12s | Auto-Uploads on First Run)
        if: ${{ github.event.inputs.target_archive != 'LIST' && github.event.inputs.target_archive != 'list' && !startsWith(github.event.inputs.target_archive, 'STATUS') && !startsWith(github.event.inputs.target_archive, 'status') && !startsWith(github.event.inputs.target_archive, 'DELETE:') && !startsWith(github.event.inputs.target_archive, 'delete:') }}
        run: |
          if rclone lsf gdrive:Tools/renpy_toolchain.tar >/dev/null 2>&1; then
            echo "⚡ Pulling cached toolchain from Google Drive..."
            rclone copyto gdrive:Tools/renpy_toolchain.tar /tmp/renpy_toolchain.tar --multi-thread-streams 8 --drive-chunk-size 128M
            tar -xf /tmp/renpy_toolchain.tar -C .
            rm -f /tmp/renpy_toolchain.tar
          else
            echo "📦 First run: downloading tools & caching to gdrive:Tools/renpy_toolchain.tar..."
            mkdir -p toolchain/bin toolchain/opt
            wget -q "https://raw.githubusercontent.com/Shizmob/rpatool/master/rpatool" -O toolchain/bin/rpatool
            chmod +x toolchain/bin/rpatool

            git clone --depth 1 https://github.com/CensoredUsername/unrpyc.git toolchain/opt/unrpyc_py3
            git clone --depth 1 --branch legacy https://github.com/CensoredUsername/unrpyc.git toolchain/opt/unrpyc_py2 || git clone --depth 1 https://github.com/CensoredUsername/unrpyc.git toolchain/opt/unrpyc_py2

            RENPY7_VER="7.7.3"
            wget -q "https://www.renpy.org/dl/${RENPY7_VER}/renpy-${RENPY7_VER}-sdk.tar.bz2"
            tar -xjf "renpy-${RENPY7_VER}-sdk.tar.bz2"
            mv "renpy-${RENPY7_VER}-sdk" toolchain/renpy7_sdk
            rm -f "renpy-${RENPY7_VER}-sdk.tar.bz2"

            RENPY_VER="8.5.0"
            wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY7_VER}-sdk.tar.bz2" 2>/dev/null || true
            wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY7_VER}-sdk.tar.bz2"
            tar -xjf "renpy-${RENPY7_VER}-sdk.tar.bz2" 2>/dev/null || true
            tar -xjf "renpy-${RENPY7_VER}-sdk.tar.bz2"
            mv "renpy-${RENPY7_VER}-sdk" toolchain/renpy_sdk
            rm -f "renpy-${RENPY7_VER}-sdk.tar.bz2"

            wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY_VER}-web.zip"
            unzip -q "renpy-${RENPY_VER}-web.zip" -d temp_web/
            mkdir -p toolchain/renpy_sdk/web
            WEB_INNER=$(dirname "$(find temp_web -name "index.html" | head -n 1)")
            cp -r "$WEB_INNER"/* toolchain/renpy_sdk/web/
            rm -rf temp_web "renpy-${RENPY_VER}-web.zip"

            tar -cf /tmp/renpy_toolchain.tar toolchain
            rclone copyto /tmp/renpy_toolchain.tar gdrive:Tools/renpy_toolchain.tar --multi-thread-streams 8 --drive-chunk-size 128M
            rm -f /tmp/renpy_toolchain.tar
          fi

          sudo ln -sf "$PWD/toolchain/bin/rpatool" /usr/local/bin/rpatool
          sudo ln -sfn "$PWD/toolchain/opt/unrpyc_py3" /opt/unrpyc_py3
          sudo ln -sfn "$PWD/toolchain/opt/unrpyc_py2" /opt/unrpyc_py2
          ln -sfn "$PWD/toolchain/renpy_sdk" renpy_sdk
          ln -sfn "$PWD/toolchain/renpy7_sdk" renpy7_sdk

      - name: Build Selected Games on Chosen Target (sync / sync_1..5)
        if: ${{ github.event.inputs.target_archive != 'LIST' && github.event.inputs.target_archive != 'list' && !startsWith(github.event.inputs.target_archive, 'STATUS') && !startsWith(github.event.inputs.target_archive, 'status') && !startsWith(github.event.inputs.target_archive, 'DELETE:') && !startsWith(github.event.inputs.target_archive, 'delete:') }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          POD_TARGETS_JSON: ${{ secrets.POD_TARGETS_JSON }}
          TARGET: ${{ github.event.inputs.target_archive }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          EDITOR: cat
          VISUAL: cat
          BROWSER: echo
        run: |
          set +e
          notify_tg() {
            local MSG="$1"
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              PAYLOAD=$(python3 -c 'import os, sys, json; print(json.dumps({"chat_id": os.environ["TG_CHAT"], "text": sys.argv[1]}))' "$MSG")
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" >/dev/null || true
            fi
          }

          PARSED=$(python3 - << 'PARSEPY'
          import os, re, json

          raw = os.environ.get("TARGET", "").strip()
          default_pods = [
              {"name": "sync", "repo": os.environ["REPO_NAME"], "pages_base": f"https://hola41242.github.io/{os.environ['REPO_NAME'].split('/')[-1]}", "max_mb": 850},
              {"name": "sync_1", "repo": "hola41242/data_sync_1", "pages_base": "https://hola41242.github.io/data_sync_1", "max_mb": 850},
              {"name": "sync_2", "repo": "hola41242/data_sync_2", "pages_base": "https://hola41242.github.io/data_sync_2", "max_mb": 850},
              {"name": "sync_3", "repo": "hola41242/data_sync_3", "pages_base": "https://hola41242.github.io/data_sync_3", "max_mb": 850},
              {"name": "sync_4", "repo": "hola41242/data_sync_4", "pages_base": "https://hola41242.github.io/data_sync_4", "max_mb": 850},
              {"name": "sync_5", "repo": "hola41242/data_sync_5", "pages_base": "https://hola41242.github.io/data_sync_5", "max_mb": 850},
          ]
          raw_pods = os.environ.get("POD_TARGETS_JSON", "").strip()
          pods = json.loads(raw_pods) if raw_pods else default_pods

          alias_map = {
              "sync": 0, "pod-0": 0, "data_sync": 0,
              "sync_1": 1, "pod-1": 1, "data_sync_1": 1,
              "sync_2": 2, "pod-2": 2, "data_sync_2": 2,
              "sync_3": 3, "pod-3": 3, "data_sync_3": 3,
              "sync_4": 4, "pod-4": 4, "data_sync_4": 4,
              "sync_5": 5, "pod-5": 5, "data_sync_5": 5,
          }

          target_idx = 0
          rest = raw
          m = re.match(r'^(sync(?:_[1-5])?|pod-[0-5]|data_sync(?:_[1-5])?)\s*[:\s]+(.+)$', raw, re.I)
          if m:
              target_idx = alias_map.get(m.group(1).lower(), 0)
              rest = m.group(2).strip()

          if target_idx >= len(pods):
              target_idx = 0
          pod = pods[target_idx]
          tlabel = "sync" if target_idx == 0 else f"sync_{target_idx}"
          print(f"{target_idx}|{pod['repo']}|{tlabel}|{pod['pages_base'].rstrip('/')}|{rest}")
          PARSEPY
          )

          TARGET_IDX=$(echo "$PARSED" | cut -d'|' -f1)
          TARGET_REPO=$(echo "$PARSED" | cut -d'|' -f2)
          TARGET_LABEL=$(echo "$PARSED" | cut -d'|' -f3)
          TARGET_BASE=$(echo "$PARSED" | cut -d'|' -f4)
          REST_FILES=$(echo "$PARSED" | cut -d'|' -f5-)

          mkdir -p site_root
          cd site_root
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -b gh-pages origin/gh-pages
          else
            git checkout -b gh-pages
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ..

