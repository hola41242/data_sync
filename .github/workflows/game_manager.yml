name: Universal RenPy Lossless Web Streamer (Telegram + Auto-Clean)

on:
  workflow_dispatch:
    inputs:
      target_archive:
        description: 'Enter "LIST", "STATUS", "ALL", "DELETE: slug", or comma-separated filenames'
        required: true
        default: 'STATUS'

permissions:
  contents: write

jobs:
  build-universal-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure Rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: List Games in Google Drive (LIST)
        if: ${{ github.event.inputs.target_archive == 'LIST' || github.event.inputs.target_archive == 'list' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export LIST_OUT=$(rclone lsf gdrive:Games --files-only | grep -iE '\.(zip|rar|7z)$' | sort)
          export COMMA_OUT=$(echo "$LIST_OUT" | paste -sd ", " -)
          echo "AVAILABLE ARCHIVES:"
          echo "$LIST_OUT"
          echo "COMMA-SEPARATED: $COMMA_OUT"

          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            python3 - << 'TGPY'
          import os, urllib.request, json
          list_out = os.environ.get("LIST_OUT", "").strip()
          comma_out = os.environ.get("COMMA_OUT", "").strip()
          msg = "📂 *Google Drive (`gdrive:Games`):*\n\n" + (f"```\n{list_out}\n```\n\n📋 *Copy-Paste Build Command:*\n`/build {comma_out}`" if list_out else "_No archives found._")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": msg[:4000], "parse_mode": "Markdown"}).encode(),
              headers={"Content-Type": "application/json"}
          )
          urllib.request.urlopen(req)
          TGPY
          fi

      - name: Check Storage & Ready Builds (STATUS)
        if: ${{ github.event.inputs.target_archive == 'STATUS' || github.event.inputs.target_archive == 'status' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p site_root
          cd site_root
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -b gh-pages origin/gh-pages
          fi

          python3 - << 'STATPY'
          import os, urllib.request, json

          def dir_size(path):
              total = 0
              for r, _, files in os.walk(path):
                  for f in files:
                      total += os.path.getsize(os.path.join(r, f))
              return total

          games = sorted([d for d in os.listdir('.') if os.path.isdir(d) and not d.startswith('.') and os.path.exists(os.path.join(d, 'index.html'))])
          lines = []
          total_bytes = 0
          for g in games:
              sz = dir_size(g)
              total_bytes += sz
              lines.append(f"• `{g}` ({round(sz/1048576, 1)} MB) → https://hola41242.github.io/data_sync/{g}/")

          used_mb = round(total_bytes / 1048576, 1)
          free_mb = round(max(0, 850 - used_mb), 1)
          body = "\n".join(lines) if lines else "_No live games deployed yet._"
          msg = f"📊 *GitHub Pages Quota:* `{used_mb} MB / 850 MB` (`{free_mb} MB` free)\n\n🎮 *Ready Builds ({len(games)}):*\n{body}"
          print(msg)

          if os.environ.get("TG_TOKEN") and os.environ.get("TG_CHAT"):
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
                  data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": msg[:4000], "parse_mode": "Markdown", "disable_web_page_preview": True}).encode(),
                  headers={"Content-Type": "application/json"}
              )
              urllib.request.urlopen(req)
          STATPY

      - name: Delete Specific Games (DELETE)
        if: ${{ startsWith(github.event.inputs.target_archive, 'DELETE:') || startsWith(github.event.inputs.target_archive, 'delete:') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TARGET: ${{ github.event.inputs.target_archive }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p site_root
          cd site_root
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git"
          git fetch origin gh-pages
          git checkout -b gh-pages origin/gh-pages

          SLUGS=$(echo "$TARGET" | sed -E 's/^[Dd][Ee][Ll][Ee][Tt][Ee]:[[:space:]]*//' | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')
          echo "$SLUGS" | while IFS= read -r S; do
            [ -z "$S" ] && continue
            echo "Deleting game: $S"
            rm -rf "$S"
            gh release delete "game-$S" --yes --cleanup-tag || true
          done

          python3 - << 'INDEXPY'
          import os
          games = sorted([d for d in os.listdir('.') if os.path.isdir(d) and not d.startswith('.') and os.path.exists(os.path.join(d, 'index.html'))])
          cards = "\n".join([f'<a href="./{g}/" style="display:block;padding:18px;margin:10px;background:#1e1e2e;color:#fff;text-decoration:none;border-radius:10px;font:600 18px sans-serif;border:1px solid #313244;">▶ {g.upper()} <span style="float:right;color:#a6e3a1;font-size:13px;">/{g}/</span></a>' for g in games])
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(f'<!DOCTYPE html><html><head><meta charset="utf-8"><title>Game Stream Library</title></head><body style="background:#11111b;color:#cdd6f4;font-family:sans-serif;max-width:700px;margin:40px auto;padding:20px;"><h1>🎮 Cloud Ren\'Py Library</h1>{cards}</body></html>')
          INDEXPY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Delete selected games" || echo "Nothing to commit"
          git push origin gh-pages

          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"🗑️ Removed requested game(s) & freed storage! Send /status to verify.\"}" >/dev/null
          fi

      - name: Install Tools, rpatool & Official Ren'Py SDK
        if: ${{ github.event.inputs.target_archive != 'LIST' && github.event.inputs.target_archive != 'list' && github.event.inputs.target_archive != 'STATUS' && github.event.inputs.target_archive != 'status' && !startsWith(github.event.inputs.target_archive, 'DELETE:') && !startsWith(github.event.inputs.target_archive, 'delete:') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar wget zip unzip python3 tar bzip2
          wget -q "https://raw.githubusercontent.com/Shizmob/rpatool/master/rpatool" -O /usr/local/bin/rpatool
          chmod +x /usr/local/bin/rpatool

          RENPY_VER="8.3.4"
          wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY_VER}-sdk.tar.bz2"
          tar -xjf "renpy-${RENPY_VER}-sdk.tar.bz2"
          mv "renpy-${RENPY_VER}-sdk" renpy_sdk
          rm -f "renpy-${RENPY_VER}-sdk.tar.bz2"

          wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY_VER}-web.zip"
          unzip -q "renpy-${RENPY_VER}-web.zip" -d temp_web/
          mkdir -p renpy_sdk/web
          WEB_INNER=$(dirname "$(find temp_web -name "index.html" | head -n 1)")
          cp -r "$WEB_INNER"/* renpy_sdk/web/
          rm -rf temp_web "renpy-${RENPY_VER}-web.zip"

      - name: Build Selected Games into 45MB Natural-Ordered Chunks & Deploy
        if: ${{ github.event.inputs.target_archive != 'LIST' && github.event.inputs.target_archive != 'list' && github.event.inputs.target_archive != 'STATUS' && github.event.inputs.target_archive != 'status' && !startsWith(github.event.inputs.target_archive, 'DELETE:') && !startsWith(github.event.inputs.target_archive, 'delete:') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TARGET: ${{ github.event.inputs.target_archive }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p site_root
          cd site_root
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -b gh-pages origin/gh-pages
          else
            git checkout -b gh-pages
          fi
          cd ..

          if [ "$TARGET" = "ALL" ]; then
            FILES=$(rclone lsf gdrive:Games --files-only | grep -iE '\.(zip|rar|7z)$')
          else
            FILES=$(echo "$TARGET" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          fi

          echo "$FILES" | while IFS= read -r ARCHIVE; do
            [ -z "$ARCHIVE" ] && continue
            SLUG=$(echo "$ARCHIVE" | sed -E 's/[-_][0-9].*$//' | sed -E 's/\.[^.]+$//' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+//g' | cut -c1-20)
            [ -z "$SLUG" ] && SLUG="game$(date +%s)"
            TAG="game-${SLUG}"

            if [ "$TARGET" = "ALL" ] && [ -d "site_root/$SLUG" ] && gh release view "$TAG" >/dev/null 2>&1; then
              echo "Skipping already live game: $SLUG ($ARCHIVE)"
              continue
            fi

            echo "=== Building $ARCHIVE -> /$SLUG/ ==="
            rm -rf raw_extract game_src web_out chunks_out
            mkdir -p raw_extract game_src web_out chunks_out

            rclone copyto "gdrive:Games/${ARCHIVE}" "./${ARCHIVE}" --multi-thread-streams 8 --drive-chunk-size 128M -P
            7z x "${ARCHIVE}" -oraw_extract -y || unrar x -y "${ARCHIVE}" raw_extract/
            rm -f "${ARCHIVE}"

            SUBDIRS=$(find raw_extract -mindepth 1 -maxdepth 1 -type d | wc -l)
            FCOUNT=$(find raw_extract -mindepth 1 -maxdepth 1 -type f | wc -l)
            if [ "$SUBDIRS" -eq 1 ] && [ "$FCOUNT" -eq 0 ]; then
              INNER_DIR=$(find raw_extract -mindepth 1 -maxdepth 1 -type d)
              mv "$INNER_DIR"/* game_src/
            else
              mv raw_extract/* game_src/
            fi

            find game_src/game -name "*.rpa" | sort | while read -r rpa; do
              python3 /usr/local/bin/rpatool -x "$rpa" -o game_src/game/
              rm -f "$rpa"
            done

            cat << 'PROGTXT' > game_src/game/progressive_download.txt
          - game/**.rpy
          - game/**.rpyc
          - game/**.rpyb
          - game/**.ttf
          - game/**.otf
          + game/**
          PROGTXT

            ./renpy_sdk/renpy.sh ./renpy_sdk/launcher web_build game_src --destination web_out

            cat << 'PYSCRIPT' > pack_chunks.py
          import os, re, zipfile, json, shutil

          prog_dir = "web_out/game"
          chunks_dir = "chunks_out"
          MAX_CHUNK_BYTES = 45 * 1024 * 1024

          heavy_files = []
          if os.path.exists(prog_dir):
              for root, _, files in os.walk(prog_dir):
                  for fname in sorted(files):
                      full_path = os.path.join(root, fname)
                      rel_path = os.path.relpath(full_path, "web_out").replace("\\", "/")
                      size = os.path.getsize(full_path)
                      heavy_files.append((full_path, rel_path, size))

          def natural_tokens(s):
              return [int(t) if t.isdigit() else t for t in re.split(r'(\d+)', s.lower())]

          def priority_key(item):
              p = item[1].lower()
              if any(k in p for k in ['/gui/', 'splash', 'menu', 'logo', 'black', 'idle', 'hover', '.ogg', '.mp3', '_anim.webm']):
                  return (0, natural_tokens(p))
              if re.search(r'(ep|episode|ch|chapter|part|day|act)[-_ ]?0*1\b|prologue|intro', p):
                  return (1, natural_tokens(p))
              return (2, natural_tokens(p))

          heavy_files.sort(key=priority_key)

          manifest = {}
          chunk_idx = 0
          cur_size = 0
          cur_zip = None
          cur_name = None

          def open_next_chunk(idx):
              cname = f"chunk_{idx:03d}.zip"
              cpath = os.path.join(chunks_dir, cname)
              return cname, zipfile.ZipFile(cpath, 'w', compression=zipfile.ZIP_STORED)

          if heavy_files:
              cur_name, cur_zip = open_next_chunk(chunk_idx)
              for full_path, rel_path, size in heavy_files:
                  if cur_size > 0 and (cur_size + size) > MAX_CHUNK_BYTES:
                      cur_zip.close()
                      chunk_idx += 1
                      cur_size = 0
                      cur_name, cur_zip = open_next_chunk(chunk_idx)
                  cur_zip.write(full_path, rel_path)
                  manifest[rel_path] = cur_name
                  cur_size += size
              cur_zip.close()

          if os.path.exists(prog_dir):
              shutil.rmtree(prog_dir)

          with open("web_out/stream_manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f)
          PYSCRIPT

            python3 pack_chunks.py

            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" --title "Progressive Stream: $SLUG" --notes "Lossless 45MB chunks"
            if ls chunks_out/chunk_*.zip 1> /dev/null 2>&1; then
              gh release upload "$TAG" chunks_out/chunk_*.zip
            fi

            cat << 'INJECTPY' > inject_loader.py
          import os, json

          slug = os.environ["CUR_SLUG"]
          repo = os.environ["REPO_NAME"]
          tag = "game-" + slug
          worker = "https://gh-cors-proxy.shubhamyadav39275000.workers.dev"
          base_url = worker + "/?url=https://github.com/" + repo + "/releases/download/" + tag

          with open("web_out/stream_manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)

          chunks = sorted(list(set(manifest.values())))

          js_template = """
          <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
          <script>
          (function() {
            window.addEventListener('keydown', function(e) {
              if (e.key === 'F5') { e.stopImmediatePropagation(); location.reload(); }
              else if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J'))) { e.stopImmediatePropagation(); }
            }, true);

            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(regs => { for (const r of regs) r.unregister(); });
              try { navigator.serviceWorker.register = () => Promise.resolve({ scope: '/', active: null, installing: null, waiting: null, update: () => Promise.resolve(), unregister: () => Promise.resolve(true) }); } catch (e) {}
            }

            const BASE_URL = __BASE_URL__;
            const MANIFEST = __MANIFEST__;
            const ALL_CHUNKS = __CHUNKS__;
            const MAX_BUFFER_BYTES = 1024 * 1024 * 1024;

            let hud = null;
            function updateHud(text) {
              if (!document.body) return;
              if (!hud) {
                hud = document.createElement('div');
                hud.style.cssText = 'position:fixed;top:8px;right:8px;z-index:999999;background:rgba(0,0,0,0.75);color:#0f0;font:11px monospace;padding:4px 8px;border-radius:4px;pointer-events:none;transition:opacity 0.4s;';
                document.body.appendChild(hud);
              }
              hud.textContent = text;
              hud.style.opacity = '1';
              clearTimeout(hud._t);
              hud._t = setTimeout(() => { if (hud) hud.style.opacity = '0.2'; }, 3000);
            }

            const SUFFIX_MAP = new Map();
            for (const [k, chunk] of Object.entries(MANIFEST)) {
              SUFFIX_MAP.set('/' + k, { key: k, chunk });
              if (k.startsWith('game/')) SUFFIX_MAP.set('/' + k.slice(5), { key: k, chunk });
            }

            function resolveAsset(rawUrl) {
              if (!rawUrl || typeof rawUrl !== 'string' || rawUrl.startsWith('blob:') || rawUrl.startsWith('data:')) return null;
              let cleanPath = rawUrl.split('?')[0].split('#')[0];
              try { cleanPath = decodeURIComponent(cleanPath); } catch (e) {}
              cleanPath = cleanPath.replace(/\\/+/g, '/');
              for (const [suffix, info] of SUFFIX_MAP.entries()) {
                if (cleanPath.endsWith(suffix)) return info;
              }
              return null;
            }

            function writeToEmscriptenFS(relPath, uint8Data) {
              try {
                const FS = (window.Module && window.Module.FS) || window.FS;
                if (!FS) return;
                const fullPath = '/' + relPath.replace(/^\\/+/, '');
                const parts = fullPath.split('/');
                let cur = '';
                for (let i = 1; i < parts.length - 1; i++) {
                  cur += '/' + parts[i];
                  try { FS.mkdir(cur); } catch (e) {}
                }
                FS.writeFile(fullPath, uint8Data);
              } catch (e) {}
            }

            const fifoCache = new Map();
            const inflightChunks = new Map();
            let currentBufferBytes = 0;
            let activeUrgentCount = 0;

            function evictIfNeeded(neededBytes) {
              while (currentBufferBytes + neededBytes > MAX_BUFFER_BYTES && fifoCache.size > 0) {
                let oldestKey = null, oldestTime = Infinity;
                for (const [k, v] of fifoCache.entries()) {
                  if (v.lastUsed < oldestTime) { oldestTime = v.lastUsed; oldestKey = k; }
                }
                if (!oldestKey) break;
                const removed = fifoCache.get(oldestKey);
                currentBufferBytes -= removed.size;
                removed.files.clear();
                fifoCache.delete(oldestKey);
              }
            }

            function unzipAsync(uint8) {
              return new Promise((resolve, reject) => {
                fflate.unzip(uint8, (err, data) => err ? reject(err) : resolve(data));
              });
            }

            const origFetch = window.fetch.bind(window);

            async function loadChunk(chunkName, isUrgent = false, preloadAhead = 2) {
              if (fifoCache.has(chunkName)) {
                const entry = fifoCache.get(chunkName);
                entry.lastUsed = Date.now();
                return entry;
              }
              if (inflightChunks.has(chunkName)) return inflightChunks.get(chunkName);
              if (!isUrgent && activeUrgentCount > 0) return null;

              if (isUrgent) activeUrgentCount++;
              updateHud(`${isUrgent ? 'Loading' : 'Preloading'} ${chunkName} (${Math.round(currentBufferBytes/1048576)}MB)...`);

              const promise = (async () => {
                try {
                  const res = await origFetch(BASE_URL + "/" + chunkName);
                  const ab = await res.arrayBuffer();
                  const unzipped = await unzipAsync(new Uint8Array(ab));
                  const fileMap = new Map();
                  let totalSize = 0;
                  for (const [path, data] of Object.entries(unzipped)) {
                    const slicedAb = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
                    fileMap.set(path, { bytes: data, ab: slicedAb });
                    totalSize += data.byteLength;
                    writeToEmscriptenFS(path, data);
                  }
                  evictIfNeeded(totalSize);
                  const entry = { files: fileMap, size: totalSize, lastUsed: Date.now() };
                  fifoCache.set(chunkName, entry);
                  currentBufferBytes += totalSize;
                  updateHud(`HD Ready (${chunkName}) | RAM: ${Math.round(currentBufferBytes/1048576)}MB / 1024MB`);
                  return entry;
                } finally {
                  if (isUrgent) activeUrgentCount = Math.max(0, activeUrgentCount - 1);
                  inflightChunks.delete(chunkName);

                  if (preloadAhead > 0) {
                    const idx = ALL_CHUNKS.indexOf(chunkName);
                    if (idx !== -1) {
                      (async () => {
                        for (let offset = 1; offset <= preloadAhead; offset++) {
                          if (activeUrgentCount > 0) break;
                          if (idx + offset >= ALL_CHUNKS.length) break;
                          const nextName = ALL_CHUNKS[idx + offset];
                          if (!fifoCache.has(nextName) && !inflightChunks.has(nextName) && (currentBufferBytes + 60*1024*1024) <= MAX_BUFFER_BYTES) {
                            await loadChunk(nextName, false, 0).catch(() => {});
                          }
                        }
                      })();
                    }
                  }
                }
              })();

              inflightChunks.set(chunkName, promise);
              return promise;
            }

            async function getAssetRecord(info) {
              const entry = await loadChunk(info.chunk, true, 2);
              return entry ? (entry.files.get(info.key) || null) : null;
            }

            const fsSyncTimer = setInterval(() => {
              const FS = (window.Module && window.Module.FS) || window.FS;
              if (FS) {
                for (const entry of fifoCache.values()) {
                  for (const [path, rec] of entry.files.entries()) writeToEmscriptenFS(path, rec.bytes);
                }
                clearInterval(fsSyncTimer);
              }
            }, 500);

            if (ALL_CHUNKS.length > 0) loadChunk(ALL_CHUNKS[0], false, 2).catch(() => {});

            window.fetch = async function(resource, init) {
              const rawUrl = (typeof resource === 'string') ? resource : (resource && resource.url) || '';
              const info = resolveAsset(rawUrl);
              if (info) {
                const rec = await getAssetRecord(info);
                if (rec) return new Response(rec.ab, { status: 200 });
              }
              return origFetch(resource, init);
            };

            const origOpen = XMLHttpRequest.prototype.open;
            const origSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function(method, url) {
              this._streamInfo = resolveAsset(url);
              return origOpen.apply(this, arguments);
            };
            XMLHttpRequest.prototype.send = function(body) {
              const info = this._streamInfo;
              if (!info) return origSend.apply(this, arguments);
              const xhr = this;
              getAssetRecord(info).then(rec => {
                if (!rec) {
                  Object.defineProperty(xhr, 'status', { value: 404, configurable: true });
                  Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
                  xhr.dispatchEvent(new Event('readystatechange'));
                  xhr.dispatchEvent(new Event('error'));
                  return;
                }
                let respVal = rec.ab;
                if (xhr.responseType === 'blob') respVal = new Blob([rec.bytes]);
                else if (xhr.responseType === 'text' || xhr.responseType === '') respVal = new TextDecoder().decode(rec.bytes);
                else if (xhr.responseType === 'json') respVal = JSON.parse(new TextDecoder().decode(rec.bytes));
                Object.defineProperty(xhr, 'status', { value: 200, configurable: true });
                Object.defineProperty(xhr, 'statusText', { value: 'OK', configurable: true });
                Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
                Object.defineProperty(xhr, 'response', { value: respVal, configurable: true });
                if (xhr.responseType === '' || xhr.responseType === 'text') Object.defineProperty(xhr, 'responseText', { value: respVal, configurable: true });
                xhr.dispatchEvent(new Event('readystatechange'));
                xhr.dispatchEvent(new Event('load'));
                xhr.dispatchEvent(new Event('loadend'));
              });
            };

            function patchMediaElement(el) {
              const rawSrc = el.getAttribute('src') || el.src;
              const info = resolveAsset(rawSrc);
              if (!info || el._streamPatched) return;
              el._streamPatched = true;
              el.removeAttribute('src');
              getAssetRecord(info).then(rec => {
                if (rec) {
                  el.src = URL.createObjectURL(new Blob([rec.bytes], { type: 'video/webm' }));
                  const target = (el.tagName === 'SOURCE' && el.parentElement) ? el.parentElement : el;
                  if (target.load) target.load();
                  if (target.play) target.play().catch(() => {});
                }
              });
            }

            const mediaSrcDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
            if (mediaSrcDesc && mediaSrcDesc.set) {
              Object.defineProperty(HTMLMediaElement.prototype, 'src', {
                get: mediaSrcDesc.get,
                set: function(val) {
                  const info = resolveAsset(val);
                  if (info) {
                    const el = this;
                    getAssetRecord(info).then(rec => {
                      if (rec) {
                        mediaSrcDesc.set.call(el, URL.createObjectURL(new Blob([rec.bytes], { type: 'video/webm' })));
                        el.load(); el.play().catch(() => {});
                      }
                    });
                    return;
                  }
                  mediaSrcDesc.set.call(this, val);
                },
                configurable: true
              });
            }

            new MutationObserver(muts => {
              for (const m of muts) {
                for (const node of m.addedNodes) {
                  if (node.tagName === 'VIDEO' || node.tagName === 'SOURCE') patchMediaElement(node);
                  if (node.querySelectorAll) node.querySelectorAll('video, source').forEach(patchMediaElement);
                }
              }
            }).observe(document.documentElement, { childList: true, subtree: true });
          })();
          </script>
          """

          hook = (js_template
                  .replace("__BASE_URL__", json.dumps(base_url))
                  .replace("__MANIFEST__", json.dumps(manifest))
                  .replace("__CHUNKS__", json.dumps(chunks)))

          with open("web_out/index.html", "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("<head>", "<head>" + hook, 1)
          with open("web_out/index.html", "w", encoding="utf-8") as f:
              f.write(html)

          os.remove("web_out/stream_manifest.json")
          INJECTPY

            CUR_SLUG="$SLUG" python3 inject_loader.py
            rm -rf "site_root/$SLUG"
            mv web_out "site_root/$SLUG"
            date +%s > "site_root/$SLUG/.built_ts"
            rm -rf raw_extract game_src chunks_out pack_chunks.py inject_loader.py
          done

          cd site_root
          python3 - << 'EVICTPY'
          import os, shutil, subprocess

          MAX_BYTES = 850 * 1024 * 1024

          def dir_size(path):
              total = 0
              for r, _, files in os.walk(path):
                  for f in files:
                      total += os.path.getsize(os.path.join(r, f))
              return total

          def built_time(d):
              ts_file = os.path.join(d, '.built_ts')
              if os.path.exists(ts_file):
                  try:
                      return int(open(ts_file).read().strip())
                  except ValueError:
                      pass
              return 0

          games = [d for d in os.listdir('.') if os.path.isdir(d) and not d.startswith('.') and os.path.exists(os.path.join(d, 'index.html'))]
          games.sort(key=built_time)

          total = sum(dir_size(g) for g in games)
          while total > MAX_BYTES and len(games) > 1:
              oldest = games.pop(0)
              sz = dir_size(oldest)
              print(f"Auto-evicting oldest game: {oldest}")
              shutil.rmtree(oldest)
              subprocess.run(["gh", "release", "delete", f"game-{oldest}", "--yes", "--cleanup-tag"], check=False)
              total -= sz
          EVICTPY

          python3 - << 'INDEXPY'
          import os
          games = sorted([d for d in os.listdir('.') if os.path.isdir(d) and not d.startswith('.') and os.path.exists(os.path.join(d, 'index.html'))])
          cards = "\n".join([f'<a href="./{g}/" style="display:block;padding:18px;margin:10px;background:#1e1e2e;color:#fff;text-decoration:none;border-radius:10px;font:600 18px sans-serif;border:1px solid #313244;">▶ {g.upper()} <span style="float:right;color:#a6e3a1;font-size:13px;">/{g}/</span></a>' for g in games])
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(f'<!DOCTYPE html><html><head><meta charset="utf-8"><title>Game Stream Library</title></head><body style="background:#11111b;color:#cdd6f4;font-family:sans-serif;max-width:700px;margin:40px auto;padding:20px;"><h1>🎮 Cloud Ren\'Py Library</h1>{cards}</body></html>')
          INDEXPY

