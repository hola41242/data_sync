name: Game Manager (Archive Extract + Unpack + Split + Save Structure)

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: 'Exact archive filename in gdrive:Games (e.g. CampusBonds-0.5-market.zip)'
        required: true
        default: 'CampusBonds-0.5-market.zip'

jobs:
  build-game-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar rsync
          curl https://rclone.org/install.sh | sudo bash
          pip install unrpa

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Pull Single Archive from Drive (Fast 1-File Pull)
        run: |
          mkdir -p raw_extract full_game engine_shell
          rclone copy "gdrive:Games/${{ github.event.inputs.archive_name }}" . --drive-chunk-size 128M -P

      - name: Extract Archive on GitHub SSD & Normalize Folder Structure
        run: |
          ARCHIVE="${{ github.event.inputs.archive_name }}"
          7z x "$ARCHIVE" -oraw_extract -y || unrar x -y "$ARCHIVE" raw_extract/
          rm -f "$ARCHIVE"

          # Agar extract ke andar ek single subfolder bana hai toh uske contents ko full_game/ root pe laao
          SUBDIRS=$(find raw_extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find raw_extract -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$SUBDIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            INNER_DIR=$(find raw_extract -mindepth 1 -maxdepth 1 -type d)
            mv "$INNER_DIR"/* full_game/
          else
            mv raw_extract/* full_game/
          fi

      - name: Unpack .rpa Archives (100% Byte-for-Byte Lossless)
        run: |
          find full_game -name "*.rpa" | while read rpa; do
            dir=$(dirname "$rpa")
            unrpa -mp "$dir" "$rpa" && rm -f "$rpa"
          done

      - name: Create Lightweight Engine Shell (~100MB Code Only)
        run: |
          rsync -av --exclude='game/images' --exclude='game/videos' --exclude='game/video' --exclude='game/audio' --exclude='game/music' --exclude='game/sfx' --exclude='game/voice' full_game/ engine_shell/
          mkdir -p engine_shell/game/saves

      - name: Push Clean Architecture & Saves to Drive
        run: |
          GAME_FOLDER="${{ github.event.inputs.archive_name }}"
          GAME_FOLDER="${GAME_FOLDER%.*}"
          echo "Target Game Folder: $GAME_FOLDER"

          rclone sync full_game/ "gdrive:Games_Unpacked/$GAME_FOLDER" --transfers 32 --checkers 32 --drive-chunk-size 64M --tpslimit 10 -P
          rclone sync engine_shell/ "gdrive:Games_Shell/$GAME_FOLDER" --transfers 32 --tpslimit 10 -P
          rclone copy engine_shell/game/saves/ "gdrive:Games/$GAME_FOLDER/saves/" --create-empty-src-dirs
