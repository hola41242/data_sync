name: Build Lossless RenPy Web Library (24/7 Playnite Stream)

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: 'Archive filename inside gdrive:Games (e.g. CampusBonds-0.5-market.zip)'
        required: true
        default: 'CampusBonds-0.5-market.zip'
      game_slug:
        description: 'Clean URL folder name (lowercase, no spaces, e.g. bonds)'
        required: true
        default: 'campusbonds'

permissions:
  contents: write

jobs:
  build-lossless-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Tools & Official Ren'Py SDK + Web Support
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar wget
          curl https://rclone.org/install.sh | sudo bash

          RENPY_VER="8.3.4"
          wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY_VER}-sdk.tar.bz2"
          tar -xf "renpy-${RENPY_VER}-sdk.tar.bz2"
          mv "renpy-${RENPY_VER}-sdk" renpy_sdk

          wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY_VER}-web.zip"
          unzip -q "renpy-${RENPY_VER}-web.zip" -d renpy_sdk/

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Pull & Extract Game (100% Original Lossless Assets)
        run: |
          mkdir -p raw_extract game_src
          rclone copyto "gdrive:Games/${{ github.event.inputs.archive_name }}" "./${{ github.event.inputs.archive_name }}" --multi-thread-streams 8 --drive-chunk-size 128M -P
          7z x "${{ github.event.inputs.archive_name }}" -oraw_extract -y || unrar x -y "${{ github.event.inputs.archive_name }}" raw_extract/
          rm -f "${{ github.event.inputs.archive_name }}"

          SUBDIRS=$(find raw_extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find raw_extract -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$SUBDIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            INNER_DIR=$(find raw_extract -mindepth 1 -maxdepth 1 -type d)
            mv "$INNER_DIR"/* game_src/
          else
            mv raw_extract/* game_src/
          fi

          # Mac/Linux extra binaries hatao (game assets untouched)
          rm -rf game_src/*.app game_src/lib/py3-linux* game_src/lib/py3-mac* game_src/*.sh

      - name: Build Lossless Progressive Web Package
        run: |
          mkdir -p web_out
          ./renpy_sdk/renpy.sh ./renpy_sdk/launcher web_build ./game_src --destination ./web_out

      - name: Upload Heavy Assets to GitHub Releases CDN (Bypass 1GB Pages Limit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SLUG="${{ github.event.inputs.game_slug }}"
          TAG="game-${SLUG}"

          # Agar purana release ho toh delete karke fresh upload karo
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" --title "Game Stream: $SLUG" --notes "Lossless assets for $SLUG"

          # Agar game.zip 1.9 GB se bada hai toh 1.9 GB chunks mein split karo (0% compression)
          if [ -f "web_out/game.zip" ]; then
            SIZE=$(stat -c%s "web_out/game.zip")
            if [ "$SIZE" -gt 1900000000 ]; then
              split -b 1900M -d "web_out/game.zip" "web_out/game.zip.part"
              rm -f "web_out/game.zip"
              gh release upload "$TAG" web_out/game.zip.part*
            else
              gh release upload "$TAG" "web_out/game.zip"
              rm -f "web_out/game.zip"
            fi
          fi

      - name: Deploy Lightweight Loader to GitHub Pages (24/7 Live)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_out
          destination_dir: ${{ github.event.inputs.game_slug }}
          keep_files: true
