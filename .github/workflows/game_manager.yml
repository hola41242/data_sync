name: Universal RenPy Lossless Web Streamer (24/7 Playnite)

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: 'Archive filename inside gdrive:Games (e.g. CampusBonds-0.5-market.zip)'
        required: true
        default: 'CampusBonds-0.5-market.zip'
      game_slug:
        description: 'Clean URL folder name (lowercase, no spaces, e.g. campusbonds)'
        required: true
        default: 'campusbonds'

permissions:
  contents: write

jobs:
  build-universal-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Tools, rpatool & Official Ren'Py SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar wget zip unzip python3 tar bzip2
          curl -fsSL https://rclone.org/install.sh | sudo bash
          wget -q "https://raw.githubusercontent.com/Shizmob/rpatool/master/rpatool" -O /usr/local/bin/rpatool
          chmod +x /usr/local/bin/rpatool

          RENPY_VER="8.3.4"
          wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY_VER}-sdk.tar.bz2"
          tar -xjf "renpy-${RENPY_VER}-sdk.tar.bz2"
          mv "renpy-${RENPY_VER}-sdk" renpy_sdk
          rm -f "renpy-${RENPY_VER}-sdk.tar.bz2"

          wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY_VER}-web.zip"
          unzip -q "renpy-${RENPY_VER}-web.zip" -d temp_web/
          mkdir -p renpy_sdk/web
          WEB_INNER=$(dirname "$(find temp_web -name "index.html" | head -n 1)")
          cp -r "$WEB_INNER"/* renpy_sdk/web/
          rm -rf temp_web "renpy-${RENPY_VER}-web.zip"

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Pull Game, Compile Web Build & Split 180MB Chunks
        run: |
          mkdir -p raw_extract game_src web_out chunks_out
          rclone copyto "gdrive:Games/${{ github.event.inputs.archive_name }}" "./${{ github.event.inputs.archive_name }}" --multi-thread-streams 8 --drive-chunk-size 128M -P
          7z x "${{ github.event.inputs.archive_name }}" -oraw_extract -y || unrar x -y "${{ github.event.inputs.archive_name }}" raw_extract/
          rm -f "${{ github.event.inputs.archive_name }}"

          SUBDIRS=$(find raw_extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find raw_extract -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$SUBDIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            INNER_DIR=$(find raw_extract -mindepth 1 -maxdepth 1 -type d)
            mv "$INNER_DIR"/* game_src/
          else
            mv raw_extract/* game_src/
          fi

          find game_src/game -name "*.rpa" | sort | while read -r rpa; do
            python3 /usr/local/bin/rpatool -x "$rpa" -o game_src/game/
            rm -f "$rpa"
          done

          cat << 'PROGTXT' > game_src/game/progressive_download.txt
          - game/**.rpy
          - game/**.rpyc
          - game/**.rpyb
          - game/**.ttf
          - game/**.otf
          + game/**
          PROGTXT

          ./renpy_sdk/renpy.sh ./renpy_sdk/launcher web_build game_src --destination web_out

          cat << 'PYSCRIPT' > pack_chunks.py
          import os, zipfile, json, shutil

          prog_dir = "web_out/game"
          chunks_dir = "chunks_out"
          MAX_CHUNK_BYTES = 180 * 1024 * 1024

          heavy_files = []
          if os.path.exists(prog_dir):
              for root, _, files in os.walk(prog_dir):
                  for fname in sorted(files):
                      full_path = os.path.join(root, fname)
                      rel_path = os.path.relpath(full_path, "web_out").replace("\\", "/")
                      size = os.path.getsize(full_path)
                      heavy_files.append((full_path, rel_path, size))

          def priority_key(item):
              p = item[1].lower()
              if any(k in p for k in ['/gui/', 'splash', 'menu', 'logo', 'black', 'idle', 'hover', '.ogg', '.mp3', '_anim.webm']):
                  return (0, p)
              return (1, p)

          heavy_files.sort(key=priority_key)

          manifest = {}
          chunk_idx = 0
          cur_size = 0
          cur_zip = None
          cur_name = None

          def open_next_chunk(idx):
              cname = f"chunk_{idx:03d}.zip"
              cpath = os.path.join(chunks_dir, cname)
              return cname, zipfile.ZipFile(cpath, 'w', compression=zipfile.ZIP_STORED)

          if heavy_files:
              cur_name, cur_zip = open_next_chunk(chunk_idx)
              for full_path, rel_path, size in heavy_files:
                  if cur_size > 0 and (cur_size + size) > MAX_CHUNK_BYTES:
                      cur_zip.close()
                      chunk_idx += 1
                      cur_size = 0
                      cur_name, cur_zip = open_next_chunk(chunk_idx)
                  cur_zip.write(full_path, rel_path)
                  manifest[rel_path] = cur_name
                  cur_size += size
              cur_zip.close()

          # Remove entire web_out/game so gh-pages push stays tiny (~75MB) and never hits HTTP 500
          if os.path.exists(prog_dir):
              shutil.rmtree(prog_dir)

          with open("web_out/stream_manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f)

          print("Boot game.zip MB:", round(os.path.getsize("web_out/game.zip") / (1024 * 1024), 1), "| Chunks:", chunk_idx + 1)
          PYSCRIPT

          python3 pack_chunks.py
          rm -rf raw_extract game_src renpy_sdk pack_chunks.py

      - name: Upload Chunks & Inject Fetch + Prototype XHR + HTML5 Video Blob Hook
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAME_SLUG: ${{ github.event.inputs.game_slug }}
          REPO_NAME: ${{ github.repository }}
        run: |
          TAG="game-${GAME_SLUG}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" --title "Progressive Stream: $GAME_SLUG" --notes "Lossless progressive chunks"
          if ls chunks_out/chunk_*.zip 1> /dev/null 2>&1; then
            gh release upload "$TAG" chunks_out/chunk_*.zip
          fi
          rm -rf chunks_out

          cat << 'INJECTPY' > inject_loader.py
          import os, json

          slug = os.environ["GAME_SLUG"]
          repo = os.environ["REPO_NAME"]
          tag = "game-" + slug
          worker = "https://gh-cors-proxy.shubhamyadav39275000.workers.dev"
          base_url = worker + "/?url=https://github.com/" + repo + "/releases/download/" + tag

          with open("web_out/stream_manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)

          chunks = sorted(list(set(manifest.values())))

          js_template = """
          <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
          <script>
          (function() {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(regs => {
                for (const r of regs) r.unregister();
              });
            }

            const BASE_URL = __BASE_URL__;
            const MANIFEST = __MANIFEST__;
            const ALL_CHUNKS = __CHUNKS__;
            const MAX_BUFFER_BYTES = 900 * 1024 * 1024;

            const SUFFIX_MAP = new Map();
            for (const [k, chunk] of Object.entries(MANIFEST)) {
              SUFFIX_MAP.set('/' + k, { key: k, chunk });
              if (k.startsWith('game/')) {
                SUFFIX_MAP.set('/' + k.slice(5), { key: k, chunk });
              }
            }

            function resolveAsset(rawUrl) {
              if (!rawUrl || typeof rawUrl !== 'string') return null;
              let cleanPath = rawUrl.split('?')[0].split('#')[0];
              try { cleanPath = decodeURIComponent(cleanPath); } catch (e) {}
              cleanPath = cleanPath.replace(/\\/+/g, '/');
              for (const [suffix, info] of SUFFIX_MAP.entries()) {
                if (cleanPath.endsWith(suffix)) return info;
              }
              return null;
            }

            const fifoCache = new Map();
            const inflightChunks = new Map();
            let currentBufferBytes = 0;

            function evictIfNeeded(neededBytes) {
              while (currentBufferBytes + neededBytes > MAX_BUFFER_BYTES && fifoCache.size > 0) {
                let oldestKey = null;
                let oldestTime = Infinity;
                for (const [k, v] of fifoCache.entries()) {
                  if (v.lastUsed < oldestTime) {
                    oldestTime = v.lastUsed;
                    oldestKey = k;
                  }
                }
                if (!oldestKey) break;
                const removed = fifoCache.get(oldestKey);
                currentBufferBytes -= removed.size;
                removed.files.clear();
                fifoCache.delete(oldestKey);
              }
            }

            const origFetch = window.fetch.bind(window);

            async function loadChunk(chunkName) {
              if (fifoCache.has(chunkName)) {
                const entry = fifoCache.get(chunkName);
                entry.lastUsed = Date.now();
                return entry;
              }
              if (inflightChunks.has(chunkName)) {
                return inflightChunks.get(chunkName);
              }

              const promise = (async () => {
                const res = await origFetch(BASE_URL + "/" + chunkName);
                const ab = await res.arrayBuffer();
                const buf = new Uint8Array(ab);
                const unzipped = fflate.unzipSync(buf);
                const fileMap = new Map();
                let totalSize = 0;
                for (const [path, data] of Object.entries(unzipped)) {
                  fileMap.set(path, data);
                  totalSize += data.byteLength;
                }
                evictIfNeeded(totalSize);
                const entry = { files: fileMap, size: totalSize, lastUsed: Date.now() };
                fifoCache.set(chunkName, entry);
                currentBufferBytes += totalSize;
                inflightChunks.delete(chunkName);

                const idx = ALL_CHUNKS.indexOf(chunkName);
                if (idx !== -1) {
                  for (let next = idx + 1; next <= idx + 2 && next < ALL_CHUNKS.length; next++) {
                    const nextName = ALL_CHUNKS[next];
                    if (!fifoCache.has(nextName) && !inflightChunks.has(nextName) && (currentBufferBytes + 200*1024*1024) <= MAX_BUFFER_BYTES) {
                      loadChunk(nextName).catch(() => {});
                    }
                  }
                }
                return entry;
              })();

              inflightChunks.set(chunkName, promise);
              return promise;
            }

            async function getAssetBytes(info) {
              const entry = await loadChunk(info.chunk);
              return entry.files.get(info.key) || null;
            }

            // 1. Safe fetch override
            window.fetch = async function(resource, init) {
              const rawUrl = (typeof resource === 'string') ? resource : (resource && resource.url) || '';
              const info = resolveAsset(rawUrl);
              if (info) {
                const bytes = await getAssetBytes(info);
                if (bytes) {
                  return new Response(bytes, { status: 200 });
                }
              }
              return origFetch(resource, init);
            };

            // 2. Prototype-level XHR hook
            const origOpen = XMLHttpRequest.prototype.open;
            const origSend = XMLHttpRequest.prototype.send;

            XMLHttpRequest.prototype.open = function(method, url) {
              this._streamInfo = resolveAsset(url);
              return origOpen.apply(this, arguments);
            };

            XMLHttpRequest.prototype.send = function(body) {
              const info = this._streamInfo;
              if (!info) {
                return origSend.apply(this, arguments);
              }
              const xhr = this;
              getAssetBytes(info).then(bytes => {
                if (!bytes) {
                  Object.defineProperty(xhr, 'status', { value: 404 });
                  Object.defineProperty(xhr, 'readyState', { value: 4 });
                  xhr.dispatchEvent(new Event('readystatechange'));
                  xhr.dispatchEvent(new Event('error'));
                  return;
                }
                const ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
                let respVal = ab;
                if (xhr.responseType === 'blob') respVal = new Blob([bytes]);
                else if (xhr.responseType === 'text' || xhr.responseType === '') respVal = new TextDecoder().decode(bytes);
                else if (xhr.responseType === 'json') respVal = JSON.parse(new TextDecoder().decode(bytes));

                Object.defineProperty(xhr, 'status', { value: 200 });
                Object.defineProperty(xhr, 'statusText', { value: 'OK' });
                Object.defineProperty(xhr, 'readyState', { value: 4 });
                Object.defineProperty(xhr, 'response', { value: respVal });
                if (xhr.responseType === '' || xhr.responseType === 'text') {
                  Object.defineProperty(xhr, 'responseText', { value: respVal });
                }
                xhr.dispatchEvent(new Event('readystatechange'));
                xhr.dispatchEvent(new Event('load'));
                xhr.dispatchEvent(new Event('loadend'));
              }).catch(() => {
                Object.defineProperty(xhr, 'status', { value: 500 });
                Object.defineProperty(xhr, 'readyState', { value: 4 });
                xhr.dispatchEvent(new Event('readystatechange'));
                xhr.dispatchEvent(new Event('error'));
              });
            };

            // 3. HTML5 <video> / <source> Blob hook (serves .webm/.mp4 from chunk buffer with 0 GitHub Pages bloat)
            const origSetAttr = Element.prototype.setAttribute;
            Element.prototype.setAttribute = function(name, value) {
              if (name.toLowerCase() === 'src' && (this.tagName === 'VIDEO' || this.tagName === 'SOURCE')) {
                const info = resolveAsset(value);
                if (info) {
                  const el = this;
                  getAssetBytes(info).then(bytes => {
                    if (bytes) {
                      const blobUrl = URL.createObjectURL(new Blob([bytes], { type: 'video/webm' }));
                      origSetAttr.call(el, 'src', blobUrl);
                      if (el.tagName === 'SOURCE' && el.parentElement && el.parentElement.load) {
                        el.parentElement.load();
                      } else if (el.load) {
                        el.load();
                      }
                    }
                  });
                  return;
                }
              }
              return origSetAttr.apply(this, arguments);
            };
          })();
          </script>
          """

          hook = (js_template
                  .replace("__BASE_URL__", json.dumps(base_url))
                  .replace("__MANIFEST__", json.dumps(manifest))
                  .replace("__CHUNKS__", json.dumps(chunks)))

          with open("web_out/index.html", "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("<head>", "<head>" + hook, 1)
          with open("web_out/index.html", "w", encoding="utf-8") as f:
              f.write(html)

          os.remove("web_out/stream_manifest.json")
          INJECTPY

          python3 inject_loader.py
          rm -f inject_loader.py

      - name: Deploy Lightweight Loader to GitHub Pages (24/7 Live)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_out
          destination_dir: ${{ github.event.inputs.game_slug }}
          keep_files: true
