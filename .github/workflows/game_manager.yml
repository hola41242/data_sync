name: Build Lossless RenPy Web Library (24/7 Playnite Stream)

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: 'Archive filename inside gdrive:Games (e.g. Bonds-0.5-market.zip)'
        required: true
        default: 'CampusBonds-0.5-market.zip'
      game_slug:
        description: 'Clean URL folder name (lowercase, no spaces, e.g. campusbonds)'
        required: true
        default: 'campusbonds'

permissions:
  contents: write

jobs:
  build-lossless-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Tools & Official Ren'Py Web Runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar wget zip python3
          curl https://rclone.org/install.sh | sudo bash

          RENPY_VER="8.3.4"
          wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY_VER}-web.zip"
          unzip -q "renpy-${RENPY_VER}-web.zip" -d web_runtime/

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Pull & Package Lossless Game (Zero Re-encoding)
        run: |
          mkdir -p raw_extract game_src web_out
          rclone copyto "gdrive:Games/${{ github.event.inputs.archive_name }}" "./${{ github.event.inputs.archive_name }}" --multi-thread-streams 8 --drive-chunk-size 128M -P
          7z x "${{ github.event.inputs.archive_name }}" -oraw_extract -y || unrar x -y "${{ github.event.inputs.archive_name }}" raw_extract/
          rm -f "${{ github.event.inputs.archive_name }}"

          SUBDIRS=$(find raw_extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find raw_extract -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$SUBDIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            INNER_DIR=$(find raw_extract -mindepth 1 -maxdepth 1 -type d)
            mv "$INNER_DIR"/* game_src/
          else
            mv raw_extract/* game_src/
          fi

          # index.html jis bhi subfolder mein ho, us poore folder ko web_out/ mein copy karo
          RUNTIME_DIR=$(dirname "$(find web_runtime -name "index.html" | head -n 1)")
          cp -r "$RUNTIME_DIR"/* web_out/

          cd game_src
          zip -0 -r ../web_out/game.zip game/
          cd ..
          rm -rf raw_extract game_src

      - name: Upload Heavy Assets to GitHub Releases & Clean web_out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SLUG="${{ github.event.inputs.game_slug }}"
          TAG="game-${SLUG}"
          REPO="${{ github.repository }}"

          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" --title "Game Stream: $SLUG" --notes "Lossless assets for $SLUG"

          SIZE=$(stat -c%s "web_out/game.zip")
          if [ "$SIZE" -gt 1900000000 ]; then
            split -b 1900M -d "web_out/game.zip" "web_out/game.zip.part"
            rm -f "web_out/game.zip"
            PARTS=$(ls web_out/game.zip.part* | xargs -n1 basename)
            gh release upload "$TAG" web_out/game.zip.part*
            rm -f web_out/game.zip.part*
          else
            PARTS="game.zip"
            gh release upload "$TAG" "web_out/game.zip"
            rm -f "web_out/game.zip"
          fi

          python3 - <<EOF
          import json
          parts = """$PARTS""".strip().split()
          urls = [f"https://github.com/$REPO/releases/download/$TAG/{p}" for p in parts]
          hook = f"""
          <script>
          (function() {{
            const PART_URLS = {json.dumps(urls)};
            const origFetch = window.fetch;
            window.fetch = async function(resource, init) {{
              const url = (typeof resource === 'string') ? resource : (resource && resource.url) || '';
              if (url.endsWith('game.zip')) {{
                const responses = await Promise.all(PART_URLS.map(u => origFetch(u)));
                const streams = responses.map(r => r.body);
                const combined = new ReadableStream({{
                  async start(controller) {{
                    for (const s of streams) {{
                      const reader = s.getReader();
                      while (true) {{
                        const {{ done, value }} = await reader.read();
                        if (done) break;
                        controller.enqueue(value);
                      }}
                    }}
                    controller.close();
                  }}
                }});
                return new Response(combined, {{ headers: {{ 'Content-Type': 'application/zip' }} }});
              }}
              return origFetch.apply(this, arguments);
            }};
          }})();
          </script>
          """
          with open("web_out/index.html", "r", encoding="utf-8") as f:
            html = f.read()
          html = html.replace("<head>", "<head>" + hook, 1)
          with open("web_out/index.html", "w", encoding="utf-8") as f:
            f.write(html)
          EOF

      - name: Deploy Lightweight Loader to GitHub Pages (24/7 Live)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web_out
          destination_dir: ${{ github.event.inputs.game_slug }}
          keep_files: true
