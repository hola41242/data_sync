name: Cloud Game Stream Server (Docker WebDAV + Static Ngrok)

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: 'Archive filename inside gdrive:Games (e.g. CampusBonds-0.5-market.zip)'
        required: true
        default: 'CampusBonds-0.5-market.zip'

jobs:
  stream-game:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Install Tools & Ngrok
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar
          curl https://rclone.org/install.sh | sudo bash
          pip install unrpa
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install -y ngrok

      - name: Configure Rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Pull, Extract & Unpack Game on GitHub NVMe SSD
        run: |
          GAME_FOLDER="${{ github.event.inputs.archive_name }}"
          GAME_FOLDER="${GAME_FOLDER%.*}"
          mkdir -p raw_extract "/tmp/game_root/$GAME_FOLDER"

          rclone copyto "gdrive:Games/${{ github.event.inputs.archive_name }}" "./${{ github.event.inputs.archive_name }}" --multi-thread-streams 8 --drive-chunk-size 128M -P
          7z x "${{ github.event.inputs.archive_name }}" -oraw_extract -y || unrar x -y "${{ github.event.inputs.archive_name }}" raw_extract/
          rm -f "${{ github.event.inputs.archive_name }}"

          SUBDIRS=$(find raw_extract -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find raw_extract -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$SUBDIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            INNER_DIR=$(find raw_extract -mindepth 1 -maxdepth 1 -type d)
            mv "$INNER_DIR"/* "/tmp/game_root/$GAME_FOLDER/"
          else
            mv raw_extract/* "/tmp/game_root/$GAME_FOLDER/"
          fi

          find "/tmp/game_root/$GAME_FOLDER" -name "*.rpa" | while read rpa; do
            dir=$(dirname "$rpa")
            unrpa -mp "$dir" "$rpa" && rm -f "$rpa"
          done

          mkdir -p "/tmp/game_root/$GAME_FOLDER/game/saves"
          rclone copy "gdrive:Games/$GAME_FOLDER/saves" "/tmp/game_root/$GAME_FOLDER/game/saves" --transfers 8 || true
          chmod -R 777 /tmp/game_root

      - name: Start Docker WebDAV Server & Static Ngrok Tunnel
        run: |
          docker run -d --name game_webdav -p 8080:8080 -v /tmp/game_root:/data rclone/rclone:latest serve webdav /data --addr :8080 --vfs-cache-mode off
          ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"
          ngrok http 8080 --domain="${{ secrets.NGROK_DOMAIN }}" > /dev/null &
          sleep 5
          echo "LIVE STREAM READY AT: https://${{ secrets.NGROK_DOMAIN }}"

      - name: Keep Alive & Auto-Sync Saves Every 5 Minutes
        run: |
          GAME_FOLDER="${{ github.event.inputs.archive_name }}"
          GAME_FOLDER="${GAME_FOLDER%.*}"
          END_TIME=$(( $(date +%s) + 20700 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            rclone sync "/tmp/game_root/$GAME_FOLDER/game/saves" "gdrive:Games/$GAME_FOLDER/saves" --transfers 8 || true
          done
