name: Universal RenPy Lossless Web Streamer (Telegram + Auto-Clean)

on:
  workflow_dispatch:
    inputs:
      target_archive:
        description: 'Enter "LIST", "STATUS", "ALL", "DELETE: slug", or comma-separated filenames'
        required: true
        default: 'STATUS'

permissions:
  contents: write

jobs:
  build-universal-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure Rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: List Games in Google Drive (LIST)
        if: ${{ github.event.inputs.target_archive == 'LIST' || github.event.inputs.target_archive == 'list' }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export LIST_OUT=$(rclone lsf gdrive:Games --files-only | grep -iE '\.(zip|rar|7z)$' | sort)
          export COMMA_OUT=$(echo "$LIST_OUT" | paste -sd ", " -)
          echo "AVAILABLE ARCHIVES:"
          echo "$LIST_OUT"
          echo "COMMA-SEPARATED: $COMMA_OUT"

          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            python3 - << 'TGPY'
          import os, html, urllib.request, json
          list_out = html.escape(os.environ.get("LIST_OUT", "").strip())
          comma_out = html.escape(os.environ.get("COMMA_OUT", "").strip())
          msg = "📂 <b>Google Drive (gdrive:Games):</b>\n\n" + (f"<pre>{list_out}</pre>\n\n📋 <b>Copy-Paste Build Command:</b>\n<code>/build {comma_out}</code>" if list_out else "<i>No archives found.</i>")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": msg[:4000], "parse_mode": "HTML"}).encode(),
              headers={"Content-Type": "application/json"}
          )
          urllib.request.urlopen(req)
          TGPY
          fi

      - name: Check Storage & Ready Builds (STATUS)
        if: ${{ github.event.inputs.target_archive == 'STATUS' || github.event.inputs.target_archive == 'status' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p site_root
          cd site_root
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -b gh-pages origin/gh-pages
          fi

          python3 - << 'STATPY'
          import os, html, urllib.request, json

          def dir_size(path):
              total = 0
              for r, _, files in os.walk(path):
                  for f in files:
                      total += os.path.getsize(os.path.join(r, f))
              return total

          games = sorted([d for d in os.listdir('.') if os.path.isdir(d) and not d.startswith('.') and os.path.exists(os.path.join(d, 'index.html'))])
          lines = []
          total_bytes = 0
          for g in games:
              sz = dir_size(g)
              total_bytes += sz
              lines.append(f"• <code>{html.escape(g)}</code> ({round(sz/1048576, 1)} MB) → https://hola41242.github.io/data_sync/{g}/")

          used_mb = round(total_bytes / 1048576, 1)
          free_mb = round(max(0, 850 - used_mb), 1)
          body = "\n".join(lines) if lines else "<i>No live games deployed yet.</i>"
          msg = f"📊 <b>GitHub Pages Quota:</b> <code>{used_mb} MB / 850 MB</code> (<code>{free_mb} MB</code> free)\n\n🎮 <b>Ready Builds ({len(games)}):</b>\n{body}"
          print(msg)

          if os.environ.get("TG_TOKEN") and os.environ.get("TG_CHAT"):
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
                  data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": msg[:4000], "parse_mode": "HTML", "disable_web_page_preview": True}).encode(),
                  headers={"Content-Type": "application/json"}
              )
              urllib.request.urlopen(req)
          STATPY

      - name: Delete Specific Games (DELETE)
        if: ${{ startsWith(github.event.inputs.target_archive, 'DELETE:') || startsWith(github.event.inputs.target_archive, 'delete:') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TARGET: ${{ github.event.inputs.target_archive }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p site_root
          cd site_root
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git"
          git fetch origin gh-pages
          git checkout -b gh-pages origin/gh-pages

          SLUGS=$(echo "$TARGET" | sed -E 's/^[Dd][Ee][Ll][Ee][Tt][Ee]:[[:space:]]*//' | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')
          echo "$SLUGS" | while IFS= read -r S; do
            [ -z "$S" ] && continue
            echo "Deleting game: $S"
            rm -rf "$S"
            gh release delete "game-$S" --yes --cleanup-tag || true
          done

          python3 - << 'INDEXPY'
          import os
          games = sorted([d for d in os.listdir('.') if os.path.isdir(d) and not d.startswith('.') and os.path.exists(os.path.join(d, 'index.html'))])
          cards = "\n".join([f'<a href="./{g}/" style="display:block;padding:18px;margin:10px;background:#1e1e2e;color:#fff;text-decoration:none;border-radius:10px;font:600 18px sans-serif;border:1px solid #313244;">▶ {g.upper()} <span style="float:right;color:#a6e3a1;font-size:13px;">/{g}/</span></a>' for g in games])
          with open("index.html", "w", encoding="utf-8") as f:
              f.write(f'<!DOCTYPE html><html><head><meta charset="utf-8"><title>Game Stream Library</title></head><body style="background:#11111b;color:#cdd6f4;font-family:sans-serif;max-width:700px;margin:40px auto;padding:20px;"><h1>🎮 Cloud Ren\'Py Library</h1>{cards}</body></html>')
          INDEXPY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Delete selected games" || echo "Nothing to commit"
          git push origin gh-pages

          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TG_CHAT}\",\"text\":\"🗑️ Removed requested game(s) & freed storage! Send /status to verify.\"}" >/dev/null
          fi

      - name: Setup Toolchain (Drive Cache -> ~12s | Auto-Uploads on First Run)
        if: ${{ github.event.inputs.target_archive != 'LIST' && github.event.inputs.target_archive != 'list' && github.event.inputs.target_archive != 'STATUS' && github.event.inputs.target_archive != 'status' && !startsWith(github.event.inputs.target_archive, 'DELETE:') && !startsWith(github.event.inputs.target_archive, 'delete:') }}
        run: |
          if rclone lsf gdrive:Tools/renpy_toolchain.tar >/dev/null 2>&1; then
            echo "⚡ Pulling cached toolchain from Google Drive..."
            rclone copyto gdrive:Tools/renpy_toolchain.tar /tmp/renpy_toolchain.tar --multi-thread-streams 8 --drive-chunk-size 128M
            tar -xf /tmp/renpy_toolchain.tar -C .
            rm -f /tmp/renpy_toolchain.tar
          else
            echo "📦 First run: downloading tools & caching to gdrive:Tools/renpy_toolchain.tar..."
            mkdir -p toolchain/bin toolchain/opt
            wget -q "https://raw.githubusercontent.com/Shizmob/rpatool/master/rpatool" -O toolchain/bin/rpatool
            chmod +x toolchain/bin/rpatool

            git clone --depth 1 https://github.com/CensoredUsername/unrpyc.git toolchain/opt/unrpyc_py3
            git clone --depth 1 --branch legacy https://github.com/CensoredUsername/unrpyc.git toolchain/opt/unrpyc_py2 || git clone --depth 1 https://github.com/CensoredUsername/unrpyc.git toolchain/opt/unrpyc_py2

            RENPY7_VER="7.7.3"
            wget -q "https://www.renpy.org/dl/${RENPY7_VER}/renpy-${RENPY7_VER}-sdk.tar.bz2"
            tar -xjf "renpy-${RENPY7_VER}-sdk.tar.bz2"
            mv "renpy-${RENPY7_VER}-sdk" toolchain/renpy7_sdk
            rm -f "renpy-${RENPY7_VER}-sdk.tar.bz2"

            RENPY_VER="8.5.0"
            wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY7_VER}-sdk.tar.bz2" 2>/dev/null || true
            wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY_VER}-sdk.tar.bz2"
            tar -xjf "renpy-${RENPY7_VER}-sdk.tar.bz2"
            mv "renpy-${RENPY7_VER}-sdk" toolchain/renpy_sdk
            rm -f "renpy-${RENPY7_VER}-sdk.tar.bz2"

            wget -q "https://www.renpy.org/dl/${RENPY_VER}/renpy-${RENPY_VER}-web.zip"
            unzip -q "renpy-${RENPY_VER}-web.zip" -d temp_web/
            mkdir -p toolchain/renpy_sdk/web
            WEB_INNER=$(dirname "$(find temp_web -name "index.html" | head -n 1)")
            cp -r "$WEB_INNER"/* toolchain/renpy_sdk/web/
            rm -rf temp_web "renpy-${RENPY_VER}-web.zip"

            tar -cf /tmp/renpy_toolchain.tar toolchain
            rclone copyto /tmp/renpy_toolchain.tar gdrive:Tools/renpy_toolchain.tar --multi-thread-streams 8 --drive-chunk-size 128M
            rm -f /tmp/renpy_toolchain.tar
          fi

          sudo ln -sf "$PWD/toolchain/bin/rpatool" /usr/local/bin/rpatool
          sudo ln -sfn "$PWD/toolchain/opt/unrpyc_py3" /opt/unrpyc_py3
          sudo ln -sfn "$PWD/toolchain/opt/unrpyc_py2" /opt/unrpyc_py2
          ln -sfn "$PWD/toolchain/renpy_sdk" renpy_sdk
          ln -sfn "$PWD/toolchain/renpy7_sdk" renpy7_sdk

      - name: Build Selected Games into Script-Ordered 12MB Zero-Blur Chunks & Deploy
        if: ${{ github.event.inputs.target_archive != 'LIST' && github.event.inputs.target_archive != 'list' && github.event.inputs.target_archive != 'STATUS' && github.event.inputs.target_archive != 'status' && !startsWith(github.event.inputs.target_archive, 'DELETE:') && !startsWith(github.event.inputs.target_archive, 'delete:') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TARGET: ${{ github.event.inputs.target_archive }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          EDITOR: cat
          VISUAL: cat
          BROWSER: echo
        run: |
          set +e
          notify_tg() {
            local MSG="$1"
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              PAYLOAD=$(python3 -c 'import os, sys, json; print(json.dumps({"chat_id": os.environ["TG_CHAT"], "text": sys.argv[1]}))' "$MSG")
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" >/dev/null || true
            fi
          }

          mkdir -p site_root
          cd site_root
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_NAME}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -b gh-pages origin/gh-pages
          else
            git checkout -b gh-pages
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ..

          if [ "$TARGET" = "ALL" ]; then
            FILES=$(rclone lsf gdrive:Games --files-only | grep -iE '\.(zip|rar|7z)$')
          else
            FILES=$(echo "$TARGET" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          fi

          echo "$FILES" | while IFS= read -r ARCHIVE; do
            [ -z "$ARCHIVE" ] && continue
            SLUG=$(echo "$ARCHIVE" | sed -E 's/[-_][0-9].*$//' | sed -E 's/\.[^.]+$//' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+//g' | cut -c1-20)
            [ -z "$SLUG" ] && SLUG="game$(date +%s)"
            TAG="game-${SLUG}"

            if [ "$TARGET" = "ALL" ] && [ -d "site_root/$SLUG" ] && gh release view "$TAG" >/dev/null 2>&1; then
              echo "Skipping already live game: $SLUG ($ARCHIVE)"
              continue
            fi

            echo "=== Building $ARCHIVE -> /$SLUG/ ==="
            rm -rf raw_extract game_src web_out chunks_out script_order.json web_build.log
            mkdir -p raw_extract game_src web_out chunks_out

            if ! rclone copyto "gdrive:Games/${ARCHIVE}" "./${ARCHIVE}" --multi-thread-streams 8 --drive-chunk-size 128M; then
              notify_tg "⚠️ Failed & Skipped: $ARCHIVE (Google Drive download error)"
              rm -f "${ARCHIVE}"
              continue
            fi

            if ! 7z x "${ARCHIVE}" -oraw_extract -y >/dev/null; then
              notify_tg "⚠️ Failed & Skipped: $ARCHIVE (Archive extraction error)"
              rm -rf "${ARCHIVE}" raw_extract
              continue
            fi
            rm -f "${ARCHIVE}"

            GAME_SUBDIR=$(find raw_extract -type d -name "game" | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d" " -f2-)
            if [ -z "$GAME_SUBDIR" ]; then
              notify_tg "⚠️ Failed & Skipped: $ARCHIVE (No 'game' folder found)"
              rm -rf raw_extract
              continue
            fi
            RENPY_ROOT=$(dirname "$GAME_SUBDIR")
            cp -a "$RENPY_ROOT"/. game_src/
            rm -rf raw_extract

            find game_src/game -name "*.rpa" | sort | while read -r rpa; do
              python3 /usr/local/bin/rpatool -x "$rpa" -o game_src/game/ || true
              rm -f "$rpa"
            done

            python3 /opt/unrpyc_py3/unrpyc.py -c game_src/game/ >/dev/null 2>&1 || true
            PY2_BIN=$(find renpy7_sdk/lib -name "python" -type f | head -n 1)
            if [ -n "$PY2_BIN" ]; then
              "$PY2_BIN" /opt/unrpyc_py2/unrpyc.py -c game_src/game/ >/dev/null 2>&1 || true
            fi
            find game_src/game -name "*.rpy" | while read -r rpy; do
              rpyc="${rpy%.rpy}.rpyc"
              [ -s "$rpy" ] && [ -f "$rpyc" ] && rm -f "$rpyc"
            done

            cat << 'TRACEPY' > trace_story.py
          import os, re, json

          game_dir = "game_src/game"
          labels = {}
          label_order = []
          cur_label = "__top__"
          labels[cur_label] = []

          def natural_key(s):
              return [int(t) if t.isdigit() else t for t in re.split(r'(\d+)', s.lower())]

          rpy_files = []
          for root, _, files in os.walk(game_dir):
              for f in files:
                  if f.endswith(".rpy"):
                      rpy_files.append(os.path.join(root, f))
          rpy_files.sort(key=natural_key)

          for path in rpy_files:
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as fh:
                      for line in fh:
                          s = line.strip()
                          if not s or s.startswith("#"):
                              continue
                          m_lbl = re.match(r'^label\s+([a-zA-Z0-9_]+)\s*:', s)
                          if m_lbl:
                              cur_label = m_lbl.group(1)
                              if cur_label not in labels:
                                  labels[cur_label] = []
                                  label_order.append(cur_label)
                              continue
                          labels.setdefault(cur_label, []).append(s)
              except Exception:
                  pass

          defined_assets = {}
          for lines in labels.values():
              for s in lines:
                  m_def = re.match(r'^(?:image|define)\s+([a-zA-Z0-9_ .-]+?)\s*=\s*["\']([^"\']+\.(?:webp|png|jpg|jpeg|avif|webm|mp4|mkv|ogv|ogg|mp3|wav))["\']', s, re.I)
                  if m_def:
                      defined_assets[m_def.group(1).strip().lower()] = m_def.group(2).replace("\\", "/").lower()

          all_media = []
          for root, _, files in os.walk(game_dir):
              for f in files:
                  if f.lower().endswith(('.webp', '.png', '.jpg', '.jpeg', '.avif', '.webm', '.mp4', '.mkv', '.ogv', '.ogg', '.mp3', '.wav')):
                      rel = os.path.relpath(os.path.join(root, f), game_dir).replace("\\", "/").lower()
                      all_media.append(rel)

          by_stem = {}
          for rel in all_media:
              stem = os.path.splitext(os.path.basename(rel))[0].lower()
              by_stem.setdefault(stem, []).append(rel)
              norm = re.sub(r'[^a-z0-9]+', ' ', stem).strip()
              by_stem.setdefault(norm, []).append(rel)

          ordered_assets = []
          seen_assets = set()

          def add_rel(rel):
              if rel not in seen_assets:
                  seen_assets.add(rel)
                  ordered_assets.append("game/" + rel)

          def resolve_token(tok):
              tok = tok.strip().strip('"\'').replace("\\", "/").lower()
              if not tok:
                  return
              if tok in defined_assets:
                  tok = defined_assets[tok]
              for rel in all_media:
                  if rel == tok or rel.endswith("/" + tok):
                      add_rel(rel)
              norm = re.sub(r'[^a-z0-9]+', ' ', os.path.splitext(os.path.basename(tok))[0]).strip()
              for rel in by_stem.get(norm, []):
                  add_rel(rel)

          visited_labels = set()
          queue = ["start"] if "start" in labels else []
          for lbl in label_order:
              if lbl not in queue:
                  queue.append(lbl)
          if "__top__" not in queue:
              queue.append("__top__")

          idx = 0
          while idx < len(queue):
              lbl = queue[idx]
              idx += 1
              if lbl in visited_labels or lbl not in labels:
                  continue
              visited_labels.add(lbl)
              next_jumps = []
              for s in labels[lbl]:
                  for m_q in re.findall(r'["\']([^"\']+\.(?:webp|png|jpg|jpeg|avif|webm|mp4|mkv|ogv|ogg|mp3|wav))["\']', s, re.I):
                      resolve_token(m_q)
                  m_sc = re.match(r'^(?:scene|show)\s+([a-zA-Z0-9_ .-]+?)(?:\s+(?:at|with|as|behind|onlayer|zorder)\b|:|$)', s)
                  if m_sc:
                      resolve_token(m_sc.group(1))
                  m_pl = re.match(r'^(?:play|queue)\s+(?:music|sound|voice|audio)\s+["\']?([^"\'\n]+)', s)
                  if m_pl:
                      resolve_token(m_pl.group(1))
                  m_jc = re.match(r'^(?:jump|call)\s+(?:expression\s+)?([a-zA-Z0-9_]+)', s)
                  if m_jc:
                      target_lbl = m_jc.group(1)
                      if target_lbl in labels and target_lbl not in visited_labels:
                          next_jumps.append(target_lbl)
              if next_jumps:
                  queue[idx:idx] = next_jumps

          rank_map = {path: i for i, path in enumerate(ordered_assets)}
          with open("script_order.json", "w", encoding="utf-8") as out:
              json.dump(rank_map, out)
          print(f"Traced {len(rank_map)} story assets in chronological execution order.")
          TRACEPY
            python3 trace_story.py || echo "{}" > script_order.json

            echo "Normalizing non-WebM & audio-less videos..."
            find game_src/game -type f \( -iname "*.mkv" -o -iname "*.mp4" -o -iname "*.avi" -o -iname "*.mov" -o -iname "*.ogv" \) | while read -r vid; do
              base="${vid%.*}"
              if ffmpeg -nostdin -y -i "$vid" -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
                -map 0:v:0 -map 0:a:0? -map 1:a:0 -shortest \
                -c:v libvpx -crf 28 -b:v 1500k -deadline realtime -cpu-used 6 \
                -c:a libvorbis -ar 44100 -ac 2 "${base}.webm" >/dev/null 2>&1; then
                [ "$vid" != "${base}.webm" ] && rm -f "$vid"
              fi
            done

            find game_src/game -type f -iname "*.webm" | while read -r wvid; do
              HAS_AUDIO=$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "$wvid" 2>/dev/null)
              if [ -z "$HAS_AUDIO" ]; then
                if ffmpeg -nostdin -y -i "$wvid" -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
                  -map 0:v:0 -map 1:a:0 -shortest -c:v copy -c:a libvorbis -ar 44100 -ac 2 "${wvid}.aud.webm" >/dev/null 2>&1; then
                  mv "${wvid}.aud.webm" "$wvid"
                else
                  rm -f "${wvid}.aud.webm"
                fi
              fi
            done

            # Normalize problematic MP3s to standard 44.1kHz stereo so WebAudio never throws EncodingError
            find game_src/game -type f -iname "*.mp3" | while read -r amp3; do
              if ffmpeg -nostdin -y -i "$amp3" -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${amp3}.norm.mp3" >/dev/null 2>&1; then
                [ -s "${amp3}.norm.mp3" ] && mv "${amp3}.norm.mp3" "$amp3" || rm -f "${amp3}.norm.mp3"
              else
                rm -f "${amp3}.norm.mp3"
              fi
            done

            find game_src/game -type f -name "*.rpy" -exec sed -i -E 's/\.(mp4|mkv|avi|mov|ogv)(["'\''])/.webm\2/gi' {} +

            rm -f game_src/game/progressive_download.txt

            echo "Running Ren'Py web_build (up to 45m)..."
            if ! timeout 45m xvfb-run -a ./renpy_sdk/renpy.sh ./renpy_sdk/launcher web_build game_src --destination web_out </dev/null >web_build.log 2>&1; then
              ERR_TAIL=$(grep -v "Creating package" web_build.log | tail -n 5)
              echo "=== WEB_BUILD FAILED LOG ==="
              grep -v "Creating package" web_build.log | tail -n 40
              notify_tg "⚠️ Failed & Skipped: $ARCHIVE (Ren'Py web_build error): $ERR_TAIL"
              rm -rf game_src web_out script_order.json trace_story.py web_build.log
              continue
            fi
            rm -rf game_src trace_story.py web_build.log

            # Extract media & videos into chunks; also offload >2MB non-UI assets if game.zip is huge
            python3 - << 'SPLITZIP'
          import zipfile, os

          gzip_path = "web_out/game.zip"
          if os.path.exists(gzip_path):
              large_zip = os.path.getsize(gzip_path) > (60 * 1024 * 1024)
              tmp_zip = gzip_path + ".clean"
              with zipfile.ZipFile(gzip_path, 'r') as zin:
                  existing_names = set(zin.namelist())
                  has_game_prefix = any(n.startswith("game/") for n in existing_names if not n.endswith("/"))

                  with zipfile.ZipFile(tmp_zip, 'w', zipfile.ZIP_DEFLATED) as zout:
                      for item in zin.infolist():
                          if item.is_dir():
