            const SUFFIX_MAP = new Map();
            const BASENAME_MAP = new Map();
            for (const [k, chunk] of Object.entries(MANIFEST)) {
              const lk = k.toLowerCase();
              SUFFIX_MAP.set('/' + lk, { key: k, chunk });
              if (lk.startsWith('game/')) SUFFIX_MAP.set('/' + lk.slice(5), { key: k, chunk });
