
name: Game Manager - Cloud Processing

on:
  workflow_dispatch:
    inputs:
      archive_name:
        description: "ZIP filename in gdrive:Games"
        required: true
        default: "CampusBonds-0.5-market.zip"

permissions:
  contents: read

jobs:
  process-game:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ARCHIVE_NAME: ${{ inputs.archive_name }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure storage
        run: |
          set -euo pipefail

          mkdir -p ~/.config/rclone

          printf '%s' '${{ secrets.RCLONE_CONFIG_BASE64 }}' \
            | base64 -d > ~/.config/rclone/rclone.conf

          chmod 600 ~/.config/rclone/rclone.conf

          rclone config create r2 s3 \
            provider Cloudflare \
            access_key_id "$R2_ACCESS_KEY_ID" \
            secret_access_key "$R2_SECRET_ACCESS_KEY" \
            endpoint "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            region auto

          rclone lsd r2:"$R2_BUCKET"

      - name: Validate archive
        run: |
          set -euo pipefail

          [[ "$ARCHIVE_NAME" == "$(basename "$ARCHIVE_NAME")" ]]
          [[ "${ARCHIVE_NAME,,}" == *.zip ]]

      - name: Download source ZIP
        run: |
          set -euo pipefail

          rclone copyto \
            "gdrive:Games/$ARCHIVE_NAME" \
            "$RUNNER_TEMP/$ARCHIVE_NAME" \
            --drive-chunk-size 128M \
            --stats 30s

          sha256sum "$RUNNER_TEMP/$ARCHIVE_NAME" \
            > "$RUNNER_TEMP/source.sha256"

      - name: Test and extract ZIP
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/game"

          7z t "$RUNNER_TEMP/$ARCHIVE_NAME" -y

          7z x "$RUNNER_TEMP/$ARCHIVE_NAME" \
            "-o$RUNNER_TEMP/extracted" -y

          shopt -s dotglob nullglob
          entries=("$RUNNER_TEMP/extracted"/*)

          if [[ ${#entries[@]} -eq 1 && -d "${entries[0]}" ]]; then
            mv "${entries[0]}"/* "$RUNNER_TEMP/game/"
          else
            mv "${entries[@]}" "$RUNNER_TEMP/game/"
          fi

          test -n "$(find "$RUNNER_TEMP/game" -type f -print -quit)"

      - name: Preserve original RPA archives
        run: |
          set -euo pipefail

          COUNT=$(find "$RUNNER_TEMP/game" -type f -iname '*.rpa' | wc -l)

          echo "Preserved RPA archives: $COUNT"
          echo "No RPA unpacking or modification performed."

      - name: Generate file integrity manifest
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/game"

          find . -type f -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            > "$RUNNER_TEMP/game.sha256"

          echo "Files: $(wc -l < "$RUNNER_TEMP/game.sha256")"
          echo "Game size: $(du -sh "$RUNNER_TEMP/game" | cut -f1)"

      - name: Upload processed game to R2
        run: |
          set -euo pipefail

          GAME_ID="${ARCHIVE_NAME%.zip}"

          rclone copy \
            "$RUNNER_TEMP/game/" \
            "r2:$R2_BUCKET/games/$GAME_ID" \
            --transfers 8 \
            --checkers 16 \
            --s3-chunk-size 64M \
            --stats 15s \
            --stats-one-line

      - name: Upload integrity manifest
        run: |
          set -euo pipefail

          GAME_ID="${ARCHIVE_NAME%.zip}"

          rclone copyto \
            "$RUNNER_TEMP/game.sha256" \
            "r2:$R2_BUCKET/metadata/$GAME_ID.sha256"

          rclone copyto \
            "$RUNNER_TEMP/source.sha256" \
            "r2:$R2_BUCKET/metadata/$GAME_ID-source.sha256"

      - name: Verify remote files
        run: |
          set -euo pipefail

          GAME_ID="${ARCHIVE_NAME%.zip}"

          rclone check \
            "$RUNNER_TEMP/game/" \
            "r2:$R2_BUCKET/games/$GAME_ID" \
            --one-way \
            --download

      - name: Processing report
        if: always()
        run: |
          {
            echo "## Game Processing"
            echo "- Archive: $ARCHIVE_NAME"
            echo "- Status: ${{ job.status }}"
            if [[ -d "$RUNNER_TEMP/game" ]]; then
              echo "- Size: $(du -sh "$RUNNER_TEMP/game" | cut -f1)"
              echo "- Files: $(find "$RUNNER_TEMP/game" -type f | wc -l)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
