      const removed = fifoCache.get(oldestKey);
      currentBufferBytes -= removed.size;
      removed.files.clear();
      fifoCache.delete(oldestKey);
    }
  }

  function unzipAsync(uint8) {
    return new Promise((resolve, reject) => {
      fflate.unzip(uint8, (err, data) => err ? reject(err) : resolve(data));
    });
  }

  const origFetch = window.fetch.bind(window);

  async function loadChunk(chunkName, isUrgent = false, preloadAhead = 2) {
    if (fifoCache.has(chunkName)) {
      const entry = fifoCache.get(chunkName);
      entry.lastUsed = Date.now();
      return entry;
    }
    if (inflightChunks.has(chunkName)) return inflightChunks.get(chunkName);
    if (!isUrgent && activeUrgentCount > 0) return null;

    if (isUrgent) activeUrgentCount++;
    updateHud(`${isUrgent ? 'Loading' : 'Preloading'} ${chunkName} (${Math.round(currentBufferBytes/1048576)}MB)...`);

    const promise = (async () => {
      try {
        const res = await origFetch(BASE_URL + "/" + chunkName);
        const ab = await res.arrayBuffer();
        const unzipped = await unzipAsync(new Uint8Array(ab));
        const fileMap = new Map();
        let totalSize = 0;
        for (const [path, data] of Object.entries(unzipped)) {
          const slicedAb = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
          fileMap.set(path, { bytes: data, ab: slicedAb });
          totalSize += data.byteLength;
          writeToEmscriptenFS(path, data);
        }
        evictIfNeeded(totalSize);
        const entry = { files: fileMap, size: totalSize, lastUsed: Date.now() };
        fifoCache.set(chunkName, entry);
        currentBufferBytes += totalSize;
        updateHud(`HD Ready (${chunkName}) | RAM: ${Math.round(currentBufferBytes/1048576)}MB / 1024MB`);
        return entry;
      } finally {
        if (isUrgent) activeUrgentCount = Math.max(0, activeUrgentCount - 1);
        inflightChunks.delete(chunkName);

        if (preloadAhead > 0) {
          const idx = ALL_CHUNKS.indexOf(chunkName);
          if (idx !== -1) {
            (async () => {
              for (let offset = 1; offset <= preloadAhead; offset++) {
                if (activeUrgentCount > 0) break;
                if (idx + offset >= ALL_CHUNKS.length) break;
                const nextName = ALL_CHUNKS[idx + offset];
                if (!fifoCache.has(nextName) && !inflightChunks.has(nextName) && (currentBufferBytes + 60*1024*1024) <= MAX_BUFFER_BYTES) {
                  await loadChunk(nextName, false, 0).catch(() => {});
                }
              }
            })();
          }
        }
      }
    })();

    inflightChunks.set(chunkName, promise);
    return promise;
  }

  async function getAssetRecord(info) {
    const entry = await loadChunk(info.chunk, true, 2);
    return entry ? (entry.files.get(info.key) || null) : null;
  }

  const fsSyncTimer = setInterval(() => {
    const FS = (window.Module && window.Module.FS) || window.FS;
    if (FS) {
      for (const entry of fifoCache.values()) {
        for (const [path, rec] of entry.files.entries()) writeToEmscriptenFS(path, rec.bytes);
      }
      clearInterval(fsSyncTimer);
    }
  }, 500);

  if (ALL_CHUNKS.length > 0) loadChunk(ALL_CHUNKS[0], false, 2).catch(() => {});

  window.fetch = async function(resource, init) {
    const rawUrl = (typeof resource === 'string') ? resource : (resource && resource.url) || '';
    const info = resolveAsset(rawUrl);
    if (info) {
      const rec = await getAssetRecord(info);
      if (rec) return new Response(rec.ab, { status: 200 });
    }
    return origFetch(resource, init);
  };

  const origOpen = XMLHttpRequest.prototype.open;
  const origSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function(method, url) {
    this._streamInfo = resolveAsset(url);
    return origOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function(body) {
    const info = this._streamInfo;
    if (!info) return origSend.apply(this, arguments);
    const xhr = this;
    getAssetRecord(info).then(rec => {
      if (!rec) {
        Object.defineProperty(xhr, 'status', { value: 404, configurable: true });
        Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
        xhr.dispatchEvent(new Event('readystatechange'));
        xhr.dispatchEvent(new Event('error'));
        return;
      }
      let respVal = rec.ab;
      if (xhr.responseType === 'blob') respVal = new Blob([rec.bytes]);
      else if (xhr.responseType === 'text' || xhr.responseType === '') respVal = new TextDecoder().decode(rec.bytes);
      else if (xhr.responseType === 'json') respVal = JSON.parse(new TextDecoder().decode(rec.bytes));
      Object.defineProperty(xhr, 'status', { value: 200, configurable: true });
      Object.defineProperty(xhr, 'statusText', { value: 'OK', configurable: true });
      Object.defineProperty(xhr, 'readyState', { value: 4, configurable: true });
      Object.defineProperty(xhr, 'response', { value: respVal, configurable: true });
      if (xhr.responseType === '' || xhr.responseType === 'text') Object.defineProperty(xhr, 'responseText', { value: respVal, configurable: true });
      xhr.dispatchEvent(new Event('readystatechange'));
      xhr.dispatchEvent(new Event('load'));
      xhr.dispatchEvent(new Event('loadend'));
    });
  };

  function patchMediaElement(el) {
    const rawSrc = el.getAttribute('src') || el.src;
    const info = resolveAsset(rawSrc);
    if (!info || el._streamPatched) return;
    el._streamPatched = true;
    el.removeAttribute('src');
    getAssetRecord(info).then(rec => {
      if (rec) {
        el.src = URL.createObjectURL(new Blob([rec.bytes], { type: 'video/webm' }));
        const target = (el.tagName === 'SOURCE' && el.parentElement) ? el.parentElement : el;
        if (target.load) target.load();
        if (target.play) target.play().catch(() => {});
      }
    });
  }

  const mediaSrcDesc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
  if (mediaSrcDesc && mediaSrcDesc.set) {
    Object.defineProperty(HTMLMediaElement.prototype, 'src', {
      get: mediaSrcDesc.get,
      set: function(val) {
        const info = resolveAsset(val);
        if (info) {
          const el = this;
          getAssetRecord(info).then(rec => {
            if (rec) {
              mediaSrcDesc.set.call(el, URL.createObjectURL(new Blob([rec.bytes], { type: 'video/webm' })));
              el.load(); el.play().catch(() => {});
            }
          });
          return;
        }
        mediaSrcDesc.set.call(this, val);
      },
      configurable: true
    });
  }

  new MutationObserver(muts => {
    for (const m of muts) {
      for (const node of m.addedNodes) {
        if (node.tagName === 'VIDEO' || node.tagName === 'SOURCE') patchMediaElement(node);
        if (node.querySelectorAll) node.querySelectorAll('video, source').forEach(patchMediaElement);
      }
    }
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
